<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arunami — Admin Console</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #F3F4F6; color: #111827; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, select, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid #2563EB; outline-offset: 1px; }

:root {
  --navy: #0F2744; --navy-hover: rgba(255,255,255,0.07); --navy-active: rgba(255,255,255,0.13);
  --navy-border: rgba(255,255,255,0.09); --navy-text: #C8D8EB; --navy-muted: #7A96B3;
  --bg-page: #F3F4F6; --bg-card: #FFFFFF; --bg-secondary: #F9FAFB; --bg-tertiary: #F3F4F6;
  --border: #E5E7EB; --border-light: #F3F4F6;
  --text-primary: #111827; --text-secondary: #6B7280; --text-tertiary: #9CA3AF;
  --text-success: #059669; --text-danger: #DC2626; --text-warning: #D97706; --text-info: #2563EB;
  --bg-success: #ECFDF5; --bg-danger: #FEF2F2; --bg-warning: #FFFBEB; --bg-info: #EFF6FF;
  --sidebar-w: 234px; --topbar-h: 52px; --content-max: 1140px;
  --shadow-xs: 0 1px 2px rgba(16,24,40,0.04);
  --shadow-sm: 0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
  --shadow-md: 0 4px 12px rgba(16,24,40,0.08);
  --ring: 0 0 0 3px rgba(37,99,235,0.12);
}

.app { display: flex; height: 100vh; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; z-index: 10; }
.sb-logo { padding: 18px 18px 14px; border-bottom: 1px solid var(--navy-border); flex-shrink: 0; display:flex; align-items:center; gap:10px; }
.sb-logo-mark { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,#1e5fa8,#0F2744); display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid rgba(255,255,255,0.12); }
.sb-logo-mark i { color:#9DC2E8; font-size:17px; }
.sb-logo-name { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: 0.01em; }
.sb-logo-role { font-size: 11px; color: var(--navy-muted); margin-top: 1px; }
.sb-nav { flex: 1; overflow-y: auto; padding: 6px 0 8px; }
.sb-nav::-webkit-scrollbar { width: 3px; }
.sb-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
.sb-section { font-size: 10px; font-weight: 600; color: var(--navy-muted); letter-spacing: 0.09em; text-transform: uppercase; padding: 12px 18px 4px; }
.sb-item { display: flex; align-items: center; gap: 9px; padding: 7px 18px 7px 15px; cursor: pointer; color: var(--navy-text); font-size: 13px; transition: background 0.1s, color 0.1s; border-left: 3px solid transparent; }
.sb-item:hover { background: var(--navy-hover); color: #fff; }
.sb-item.active { background: var(--navy-active); color: #fff; border-left-color: #60A5FA; }
.sb-item i { font-size: 16px; flex-shrink: 0; opacity: 0.8; }
.sb-item.active i { opacity: 1; }
.sb-item-label { flex: 1; }
.sb-badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px; line-height: 1.5; }
.sb-badge-n { background: rgba(217,119,6,0.3); color: #FCD34D; }
.sb-badge-a { background: rgba(220,38,38,0.3); color: #FCA5A5; }
.sb-divider { height: 1px; background: var(--navy-border); margin: 5px 18px; }
.sb-user { padding: 11px 14px; border-top: 1px solid var(--navy-border); display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.sb-avatar { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0; }
.sb-user-info { flex: 1; min-width: 0; }
.sb-user-name { font-size: 12px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-user-role { font-size: 10px; color: var(--navy-muted); }

/* HEALTH */
.hbadge { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 9px; border-radius: 99px; font-weight: 600; }
.hb-sehat { background: rgba(5,150,105,0.12); color: #059669; }
.hb-siaga1 { background: rgba(217,119,6,0.12); color: #D97706; }
.hb-siaga2 { background: rgba(234,88,12,0.12); color: #EA580C; }
.hb-siaga3 { background: rgba(220,38,38,0.12); color: #DC2626; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar { height: var(--topbar-h); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 28px; background: var(--bg-card); flex-shrink: 0; gap: 8px; box-shadow: var(--shadow-xs); position: relative; z-index: 5; }
.topbar-title { font-size: 16px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
.topbar-sep { color: var(--text-tertiary); font-size: 12px; }
.topbar-ctx { font-size: 13px; color: var(--text-secondary); }
.topbar-spacer { flex: 1; }
.topbar-action { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; padding: 5px 10px; border-radius: 7px; transition: background 0.1s, color 0.1s; }
.topbar-action:hover { background: var(--bg-secondary); color: var(--text-primary); }
.content-wrap { flex: 1; overflow-y: auto; background: var(--bg-page); }
.content-wrap::-webkit-scrollbar { width: 8px; }
.content-wrap::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 99px; border: 2px solid var(--bg-page); }
.content-wrap::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
.content-inner { max-width: var(--content-max); margin: 0 auto; padding: 24px 28px 40px; animation: contentIn 0.2s ease; }
@keyframes contentIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* CARDS */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow-xs); }
.card-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
.card-sub { font-size: 11px; color: var(--text-tertiary); }

/* STAT CARDS */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow-xs); transition: border-color 0.15s, box-shadow 0.15s; }
.stat-card:hover { border-color: #D1D5DB; box-shadow: var(--shadow-sm); }
.stat-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.stat-ico { width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.stat-ico i { font-size:15px; }
.stat-label { font-size: 10px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.stat-value { font-size: 23px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat-sub { font-size: 12px; margin-top: 3px; }
.stat-up { color: var(--text-success); }
.stat-dn { color: var(--text-danger); }
.stat-neu { color: var(--text-secondary); }

/* SECTION HEADER */
.section-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; margin-top: 4px; }
.section-hdr-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

/* TABLE */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--text-tertiary); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 10px 10px; border-bottom: 1px solid var(--border-light); color: var(--text-primary); vertical-align: middle; }
.tbl tbody tr { transition: background 0.1s; }
.tbl tbody tr:hover { background: var(--bg-secondary); }
.tbl tr:last-child td { border-bottom: none; }
.tbl .muted { color: var(--text-secondary); } .tbl .pos { color: var(--text-success); } .tbl .neg { color: var(--text-danger); }
.tbl .num { font-variant-numeric: tabular-nums; }

/* USER CELL */
.ucell { display:flex; align-items:center; gap:10px; }
.uava { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0; }
.uname { font-size:13px; font-weight:500; color:var(--text-primary); }
.uemail { font-size:11px; color:var(--text-tertiary); }

/* PILLS */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.pill-aktif { background: #ECFDF5; color: #059669; }
.pill-nonaktif { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
.pill-pending { background: #FFFBEB; color: #D97706; }
.pill-ditolak { background: #FEF2F2; color: #DC2626; }
.pill-verified { background: #ECFDF5; color: #059669; }
.pill-onboard { background: #EFF6FF; color: #2563EB; }
.pill-closed { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
.pill-dibayar { background: #ECFDF5; color: #059669; }
.pill-diproses { background: #EFF6FF; color: #2563EB; }
.pill-ditahan { background: #FEF2F2; color: #DC2626; }
.pill-menunggu { background: #FFFBEB; color: #D97706; }

/* ROLE TAG */
.rtag { display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:2px 9px; border-radius:6px; font-weight:600; }
.rtag-admin { background:#EEF2FF; color:#4338CA; }
.rtag-bapm { background:#ECFEFF; color:#0E7490; }
.rtag-investor { background:#FDF4FF; color:#A21CAF; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: background 0.15s, box-shadow 0.15s, transform 0.1s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--navy); color: #fff; box-shadow: var(--shadow-xs); }
.btn-primary:hover { background: #1a3a5c; box-shadow: var(--shadow-sm); }
.btn-secondary { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); box-shadow: var(--shadow-xs); }
.btn-secondary:hover { background: var(--bg-secondary); color: var(--text-primary); }
.btn-sm { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; font-size: 12px; font-weight: 500; border-radius: 7px; cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); transition: background 0.1s, color 0.1s, border-color 0.1s; box-shadow: var(--shadow-xs); }
.btn-sm:hover { background: var(--bg-secondary); color: var(--text-primary); border-color: #D1D5DB; }
.btn-navy-sm { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; font-size: 12px; font-weight: 500; border-radius: 7px; cursor: pointer; border: 1px solid var(--navy); background: var(--navy); color: #fff; transition: background 0.15s; box-shadow: var(--shadow-xs); }
.btn-navy-sm:hover { background: #1a3a5c; }
.btn-success-sm { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; font-size:12px; font-weight:600; border-radius:7px; cursor:pointer; border:1px solid #059669; background:#059669; color:#fff; transition:background 0.15s; }
.btn-success-sm:hover { background:#047857; }
.btn-danger-sm { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; font-size:12px; font-weight:600; border-radius:7px; cursor:pointer; border:1px solid #FECACA; background:#FEF2F2; color:#DC2626; transition:background 0.15s; }
.btn-danger-sm:hover { background:#FEE2E2; }
.btn-row { display: flex; gap: 8px; margin-top: 16px; }
.btn-ico { width:28px; height:28px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary); transition:background 0.1s,color 0.1s; }
.btn-ico:hover { background:var(--bg-secondary); color:var(--text-primary); }

/* FORMS */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-field.full { grid-column: 1 / -1; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.form-input { padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--bg-card); color: var(--text-primary); outline: none; width: 100%; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: var(--shadow-xs); }
.form-input:hover { border-color: #D1D5DB; }
.form-input:focus { border-color: #2563EB; box-shadow: var(--ring); }
.form-input::placeholder { color: var(--text-tertiary); }
select.form-input { cursor: pointer; }
textarea.form-input { resize: vertical; min-height: 70px; }
.form-sec-lbl { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.07em; margin: 16px 0 9px; }

/* FILTER ROW */
.filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 12px; background: var(--bg-card); color: var(--text-secondary); cursor: pointer; outline: none; transition: border-color 0.15s, box-shadow 0.15s, color 0.15s; box-shadow: var(--shadow-xs); }
.filter-select:hover { border-color: #D1D5DB; color: var(--text-primary); }
.filter-select:focus { border-color: #2563EB; box-shadow: var(--ring); }
.search-box { display:flex; align-items:center; gap:7px; padding:6px 11px; border:1px solid var(--border); border-radius:8px; background:var(--bg-card); box-shadow:var(--shadow-xs); flex:1; min-width:180px; max-width:280px; }
.search-box i { color:var(--text-tertiary); font-size:15px; }
.search-box input { border:none; outline:none; font-size:13px; background:transparent; color:var(--text-primary); width:100%; }
.row-count { font-size: 12px; color: var(--text-tertiary); margin-left:auto; }

/* BANNERS */
.notif-bar { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 9px; padding: 11px 15px; display: flex; align-items: flex-start; gap: 9px; margin-bottom: 14px; font-size: 12px; color: #92400E; line-height: 1.55; }
.notif-bar i { margin-top: 1px; }
.info-bar { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 9px; padding: 13px 16px; margin-bottom: 14px; font-size: 12px; color: #1E40AF; line-height:1.6; }
.info-bar-title { font-size: 12px; font-weight: 600; color: #1E3A8A; margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
.alert-bar { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 9px; padding: 11px 15px; display: flex; align-items: flex-start; gap: 9px; margin-bottom: 14px; font-size: 12px; color: #991B1B; line-height: 1.55; }
.alert-bar i { margin-top: 1px; }

/* APPROVAL / TASK ITEMS */
.task-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--border-light); }
.task-item:first-child { border-top:none; }
.task-ico { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.task-ico i { font-size:16px; }
.task-body { flex:1; min-width:0; }
.task-title { font-size:13px; font-weight:500; color:var(--text-primary); }
.task-sub { font-size:11px; color:var(--text-secondary); margin-top:2px; }

/* QUEUE PANEL */
.qpanel { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:8px 18px 10px; margin-bottom:18px; box-shadow:var(--shadow-xs); }
.qpanel-hdr { display:flex; align-items:center; gap:9px; padding:12px 0 4px; }
.qcount { font-size:11px; font-weight:600; background:#FEF2F2; color:var(--text-danger); padding:2px 8px; border-radius:99px; }

/* MATRIX */
.matrix { width:100%; border-collapse:collapse; font-size:12.5px; }
.matrix th { text-align:left; padding:9px 12px; border-bottom:1px solid var(--border); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-tertiary); }
.matrix th.col-role { text-align:center; }
.matrix td { padding:9px 12px; border-bottom:1px solid var(--border-light); color:var(--text-secondary); }
.matrix td.cap { color:var(--text-primary); font-weight:500; }
.matrix td.col-role { text-align:center; }
.matrix tr:last-child td { border-bottom:none; }
.mx-yes { color:#059669; font-size:16px; }
.mx-no { color:#D1D5DB; font-size:16px; }
.mx-part { color:#D97706; font-size:13px; font-weight:600; }

/* PROGRESS */
.prog-bar-bg { height: 7px; background: var(--bg-tertiary); border-radius: 99px; overflow: hidden; }
.prog-bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s cubic-bezier(0.16,1,0.3,1); }

/* PLACEHOLDER */
.ph-card { background: var(--bg-card); border: 1px dashed var(--border); border-radius: 12px; padding: 40px 24px; text-align: center; }
.ph-icon { font-size: 34px; color: var(--text-tertiary); margin-bottom: 10px; }
.ph-title { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.ph-desc { font-size: 13px; color: var(--text-tertiary); line-height: 1.6; max-width: 420px; margin: 0 auto; }

/* CONFIG ROW */
.cfg-row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 0; border-bottom:1px solid var(--border-light); }
.cfg-row:last-child { border-bottom:none; }
.cfg-info { flex:1; min-width:0; }
.cfg-name { font-size:13px; font-weight:500; color:var(--text-primary); }
.cfg-desc { font-size:11.5px; color:var(--text-secondary); margin-top:2px; line-height:1.5; }
.cfg-val { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.cfg-num { width:74px; text-align:right; }

/* TOGGLE */
.tg { position:relative; width:38px; height:21px; border-radius:99px; background:#D1D5DB; cursor:pointer; transition:background 0.15s; flex-shrink:0; }
.tg.on { background:#059669; }
.tg::after { content:''; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; transition:transform 0.15s; box-shadow:0 1px 2px rgba(0,0,0,0.2); }
.tg.on::after { transform:translateX(17px); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.45); backdrop-filter: blur(2px); z-index: 300; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.15s ease; }
.modal-box { background: var(--bg-card); border-radius: 14px; padding: 24px; width: 480px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow-y: auto; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: modalIn 0.18s cubic-bezier(0.16,1,0.3,1); }
.modal-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -0.01em; }
.modal-sub { font-size:12px; color:var(--text-secondary); margin-bottom:16px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }

/* TOAST */
.toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; box-shadow:0 8px 30px rgba(0,0,0,0.25); z-index:400; display:flex; align-items:center; gap:9px; animation:toastIn 0.2s ease; }
.toast i { color:#6EE7B7; font-size:16px; }
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(10px);} to { opacity:1; transform:translateX(-50%) translateY(0);} }

.kvg { display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; }
.kv-lbl { font-size:10px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:2px; }
.kv-val { font-size:13px; color:var(--text-primary); font-weight:500; }
.divider-h { height:1px; background:var(--border-light); margin:14px 0; }
.link { color:var(--text-info); cursor:pointer; }
.link:hover { text-decoration:underline; }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content-wrap"><div class="content-inner" id="content"></div></div>
  </div>
</div>

<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">

    distBatches, healthRules, announcements, auditLog, earnHistory;

};

// Yield realisasi per portfolio (juta) — diisi dari laporan; kosong = belum ada.
let YIELD = {};
function distFor(pid){ const y=YIELD[pid]||0; return (capTable[pid]||[]).map(i=>({...i, distJt:Math.round(i.nominalJt*(y/100)/12*10)/10})); }
function distTotal(pid){ return Math.round(distFor(pid).reduce((s,i)=>s+i.distJt,0)*10)/10; }
// Total nominal investor yang sudah tercatat di cap table (juta)
function capSumJt(pid){ return (capTable[pid]||[]).reduce((s,i)=>s+(+i.nominalJt||0),0); }

// Rincian holding + earning seorang investor di tiap portfolio
function investorHoldings(name){
  const out=[];
  Object.keys(capTable).forEach(pid=>{
    const entry=(capTable[pid]||[]).find(x=>x.name===name);
    if(!entry) return;
    const p=getP(pid); if(!p) return;
    const totalNom=capSumJt(pid);
    const ownership=totalNom>0?entry.nominalJt/totalNom:0; // porsi bagi hasil
    const hist=earnHistory[pid]||[];
    const last=hist[hist.length-1]||null;
    const earnLast=last?Math.round(ownership*last.totalJt*100)/100:0;
    const totalEarn=Math.round(hist.reduce((s,m)=>s+ownership*m.totalJt,0)*100)/100;
    const roiBulanan=entry.nominalJt>0?(earnLast/entry.nominalJt*100):0;
    out.push({pid, nama:p.name, status:p.status, nominalJt:entry.nominalJt, ownershipPct:Math.round(ownership*1000)/10,
      earnLast, bulanLast:last?last.bulan:'—', totalEarn, roiBulanan:Math.round(roiBulanan*100)/100});
  });
  return out;
}
function investorSummary(name){
  const hold=investorHoldings(name);
  const totalInv=hold.reduce((s,h)=>s+h.nominalJt,0);
  const totalEarn=Math.round(hold.reduce((s,h)=>s+h.totalEarn,0)*100)/100;
  const avgRoi=hold.length?Math.round(hold.reduce((s,h)=>s+h.roiBulanan,0)/hold.length*100)/100:0;
  return {hold, totalInv, totalEarn, count:hold.length, avgRoi};
}
// Sel "terisi vs target" untuk halaman perusahaan: target = investasiB (miliar), terisi = cap table
function investasiCell(p){
  const targetJt=(p.investasiB||0)*1000;
  const filledJt=capSumJt(p.id);
  const pct=targetJt>0?Math.round(filledJt/targetJt*100):0;
  const barCol=pct>100?'#DC2626':pct>=100?'#059669':pct>=50?'#2563EB':'#D97706';
  return `<div style="min-width:130px">
    <div style="font-weight:600;font-size:12.5px">${rpJt(filledJt)} <span style="font-weight:400;color:var(--text-tertiary);font-size:11px">/ ${p.investasiB||0} M target</span></div>
    <div style="height:5px;border-radius:3px;background:var(--bg-secondary);margin-top:4px"><div style="height:5px;border-radius:3px;background:${barCol};width:${Math.min(100,pct)}%"></div></div>
    <div style="font-size:10.5px;color:var(--text-tertiary);margin-top:2px">${pct}% terisi${pct>100?' (over)':''} · ${capTable[p.id]?.length||0} investor</div>
  </div>`;
}

function logo(pid, size){ const p=(portfolios||[]).find(x=>x.id===pid); const b=(p&&p.brand)||BRAND[pid]||{bg:'#374151',text:'#9CA3AF',init:(p?Store.initials(p.name):'?')}; size=size||34; if(b&&b.img) return `<div style="width:${size}px;height:${size}px;border-radius:8px;flex-shrink:0;overflow:hidden;background:#fff;border:1px solid var(--border)"><img src="${b.img}" style="width:100%;height:100%;object-fit:cover"></div>`; return `<div style="width:${size}px;height:${size}px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.32)}px;font-weight:700;background:${b.bg};color:${b.text}">${b.init}</div>`; }

function getP(pid){ return portfolios.find(p=>p.id===pid); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<i class="ti ti-circle-check"></i>${msg}`; document.body.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300);},2400); }

function pendingBukti(){ return distBatches.filter(d=>d.status==='Perlu diproses'||d.status==='Diproses').length; }

function saveInvestor(){

  ['','Perlu diproses','Dilaporkan ke BA-PM','Diteruskan ke Investor','Ditahan'].forEach(s=>h+=`<option value="${s}"${ST.distStatus===s?' selected':''}>${s||'Semua status'}</option>`);

      h+=`<div style="display:grid;grid-template-columns:minmax(140px,2fr) 1fr 1fr 1fr;background:var(--bg-secondary);border-bottom:1px solid var(--border)">`;
      h+=`<div style="padding:9px 12px;font-size:11px;color:var(--text-tertiary)"></div>`;
      ['Siaga 1','Siaga 2','Siaga 3'].forEach((s,si)=>{
        const c=['#D97706','#EA580C','#DC2626'][si];
        h+=`<div style="padding:9px 12px;font-size:11.5px;font-weight:700;color:${c};text-align:center">${s}</div>`;
      });
      h+='</div>';
    } else {
      h+=`<div style="display:grid;grid-template-columns:minmax(140px,2fr) 1fr 1fr 1fr;${ri<3?'border-bottom:1px solid var(--border);':''}">`;
      h+=`<div style="padding:9px 12px;font-size:12.5px;display:flex;align-items:center">${row[0]}</div>`;
      [row[1],row[2],row[3]].forEach(k=>{
        h+=`<div style="padding:7px 10px;text-align:center"><input type="number" class="form-input cfg-num" id="rule-${k}" value="${healthRules[k]}" style="width:100%;text-align:center;padding:5px 8px"></div>`;
      });
      h+='</div>';
    }
  });
  h+='</div></div>';

  // Preview table
  h+='<div class="card"><div class="card-title" style="margin-bottom:12px">Status portfolio saat ini</div>';
  const aktif=portfolios.filter(p=>p.status==='Aktif');
  if(!aktif.length){
    h+='<div style="padding:24px;text-align:center;color:var(--text-tertiary);font-size:13px"><i class="ti ti-building-off" style="font-size:20px"></i><br>Belum ada portfolio aktif. Status muncul setelah Admin meng-onboard portfolio.</div></div>';
    return h;
  }
  h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Portfolio</th><th>Status</th><th>Keterlambatan</th><th>Vakum komunikasi</th><th>Performa bawah target</th><th>Pemicu (SOP)</th></tr></thead><tbody>';
  const today=new Date();
  aktif.forEach(p=>{
    const hari=p.keterlambatanHari||0;
    const vakum=p.lastKontakTgl?Math.max(0,Math.floor((today-new Date(p.lastKontakTgl))/86400000)):0;
    const perf=perfBulanAdmin(p.id);
    // Pemicu sesuai kerangka eskalasi SOP: keterlambatan / komunikasi / performa
    const trig=[];
    if(hari>healthRules.siaga1Hari) trig.push('Keterlambatan bayar/lapor '+hari+' hari');
    if(vakum>=healthRules.siaga1VakumHari) trig.push('Komunikasi vakum '+vakum+' hari');
    if(perf>=healthRules.siaga1PerfBulan) trig.push('Performa di bawah target '+perf+' bln');
    const pemicu=trig.length?trig.join(' · '):'Semua indikator dalam batas normal';
    h+=`<tr><td>${p.name}</td><td>${hBadge(p.health||'Sehat')}</td><td class="muted num">${hari?hari+' hari':'—'}</td><td class="muted num">${vakum?vakum+' hari':'—'}</td><td class="muted num">${perf?perf+' bln':'—'}</td><td class="muted">${pemicu}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  return h;
}
// Performa: jumlah bulan berturut net profit < 80% target (dari shared store; kosong = 0)
function perfBulanAdmin(pid){
  const rows=(Store.db.monthlyReports[pid]||[]).filter(r=>r.np!=null).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const tgt=(Store.db.projTargets[pid]||{}).np; if(!tgt||!rows.length) return 0;
  const targetNp=parseFloat(String(tgt).replace('M','')); if(!targetNp) return 0;
  let c=0; for(const r of rows){ const a=parseFloat(String(r.np).replace('M','')); if(isNaN(a)) break; if(a<targetNp*0.8) c++; else break; } return c;
}

function capRowHtml(it,idx){
  return `<tr><td><div class="ucell"><div class="uava" style="background:#FDF4FF;color:#A21CAF;width:26px;height:26px;font-size:10px">${it.init}</div>${it.name}</div></td>`+
    `<td class="num"><input class="form-input" style="text-align:right;padding:5px 8px;height:32px" type="number" min="0" value="${it.nominalJt}" oninput="_capDraft[${idx}].nominalJt=+this.value||0;capRecalc()"></td>`+
    `<td class="num" id="cap-pct-${idx}">—</td>`+
    `<td style="text-align:center"><button class="btn-danger-sm" style="padding:4px 7px" title="Hapus" onclick="capRemove(${idx})"><i class="ti ti-trash"></i></button></td></tr>`;
}
function capRecalc(){
  const total=_capDraft.reduce((s,i)=>s+(+i.nominalJt||0),0);
  const p=getP(_capPid);
  const tInput=document.getElementById('cap-target');
  const targetB=tInput?(+tInput.value||0):(p.investasiB||0);
  const targetJt=targetB*1000;
  // Porsi % dihitung relatif ke target (bisa >100% saat over-subscribed)
  _capDraft.forEach((it,idx)=>{ const cell=document.getElementById('cap-pct-'+idx); if(cell) cell.textContent=(targetJt>0?Math.round((+it.nominalJt||0)/targetJt*100):0)+'%'; });
  const tot=document.getElementById('cap-total'); if(tot) tot.textContent=rpJt(total);
  const totPctEl=document.getElementById('cap-pct-total');
  if(totPctEl){ const tp=targetJt>0?Math.round(total/targetJt*100):0; totPctEl.textContent=tp+'%'; totPctEl.style.color=tp>100?'#DC2626':'inherit'; }
  // Banner target vs terisi
  const banner=document.getElementById('cap-target-banner');
  if(banner){
    const pct=targetJt>0?Math.round(total/targetJt*100):0;
    const sisa=targetJt-total;
    const over=sisa<0;
    const barCol=over?'#DC2626':pct>=100?'#059669':pct>=50?'#2563EB':'#D97706';
    const statusTxt=over?`<span style="color:#DC2626;font-weight:600">Melebihi target ${rpJt(-sisa)}</span>`
      :sisa===0?`<span style="color:#059669;font-weight:600">Target terpenuhi</span>`
      :`Sisa ke target: <strong>${rpJt(sisa)}</strong>`;
    banner.innerHTML=`<div style="padding:11px 13px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:9px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px">
        <span style="color:var(--text-secondary)">Terisi <strong style="color:var(--text-primary)">${rpJt(total)}</strong> dari target <strong style="color:var(--text-primary)">${targetB} M</strong></span>
        <span style="font-weight:700;color:${barCol}">${pct}%</span>
      </div>
      <div style="height:6px;border-radius:3px;background:var(--bg-card);margin:7px 0 5px"><div style="height:6px;border-radius:3px;background:${barCol};width:${Math.min(100,pct)}%"></div></div>
      <div style="font-size:11px;color:var(--text-tertiary)">${statusTxt}</div>
    </div>`;
  }
}
function capAddInvestor(){
  const sel=document.getElementById('cap-add-sel'); const id=sel&&sel.value; if(!id) return;
  const iv=investorsReg.find(x=>x.id===id); if(!iv) return;
  const nom=parseFloat(document.getElementById('cap-add-nom').value)||0;
  _capDraft.push({name:iv.name,init:iv.init,nominalJt:nom});
  renderCapModal();
}
function capRemove(idx){ _capDraft.splice(idx,1); renderCapModal(); }
function saveCapTable(){
  const pid=_capPid, p=getP(pid);
  capTable[pid]=_capDraft.map(i=>({name:i.name,init:i.init,nominalJt:+i.nominalJt||0}));

  if(p&&tInput){ const nt=+tInput.value||0; if(nt!==p.investasiB){ targetChanged=` · target → ${nt} M`; p.investasiB=nt; } }
  if(p) p.investorCount=capTable[pid].length;
  auditLog.unshift({actor:ME.name,role:'Admin',aksi:`Memperbarui cap table ${p.name} — ${capTable[pid].length} investor${targetChanged}`,tgl:'Baru saja',icon:'ti-users-group',col:'#4338CA'});

function laporKeBapm(id){
  const d=distBatches.find(x=>x.id===id);
  const inv=distFor(d.pid);
  const bpi={};
  inv.forEach(i=>{
    const val=document.getElementById('bukti-'+i.name)?.value.trim();
    const prd=d.period.toLowerCase().replace(' ','-');
    bpi[i.name]=val||(val===''?`bukti-${d.pid}-${prd}-${i.name.toLowerCase().replace(/\s+/g,'-')}.pdf`:null);
  });
  const catatan=document.getElementById('dist-catatan')?.value.trim()||'';
  const uploadCount=Object.values(bpi).filter(Boolean).length;
  if(uploadCount===0){ toast('Upload minimal satu bukti transfer terlebih dahulu'); return; }
  d.buktiPerInvestor=bpi; d.status='Dilaporkan ke BA-PM'; d.reportedToBapm=true; d.bapmForwarded=false;
  d.reason=`Diproses ${ME.name} · ${uploadCount}/${inv.length} bukti terupload${catatan?' · '+catatan:''}`;
  // Field yang dibutuhkan platform BA-PM (Distribusi dari Admin)
  d.dikirimAdmin=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
  d.diprosesby=ME.name;
  d.catatan=catatan;
  d.totalJt=distTotal(d.pid);
  d.forwardedTo=d.forwardedTo||{};
  const p=getP(d.pid);
  auditLog.unshift({actor:ME.name,role:'Admin',aksi:`Memproses bagi hasil ${p?p.name:d.pid} ${d.period} (${rpJt(distTotal(d.pid))}) — dilaporkan ke BA-PM`,tgl:'Baru saja',icon:'ti-send',col:'#4338CA'});
  closeModalForce(); render(); toast('Bagi hasil diproses & dilaporkan ke BA-PM');
}
function holdDistribusi(id){
  const d=distBatches.find(x=>x.id===id); d.status='Ditahan'; d.reason='Ditahan manual oleh '+ME.name+' · '+nowStr();
  closeModalForce(); render(); toast('Bagi hasil ditahan');
}
function releaseHold(id){
  const d=distBatches.find(x=>x.id===id); d.status='Perlu diproses'; d.reason='Penahanan dilepas oleh '+ME.name+' · '+nowStr();
  closeModalForce(); render(); toast('Penahanan dilepas — silakan proses kembali');
}

const KYC_DOCS=[['ktp','KTP / identitas','ti-id'],['npwp','Kartu NPWP','ti-license'],['rekening','Rekening bank','ti-building-bank']];

  const i=investorsReg.find(x=>x.id===id);

  h+=`<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:6px">`;
  KYC_DOCS.forEach(([key,label,icon])=>{
    const file=i.docs[key];
    h+=`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:${file?'rgba(5,150,105,0.05)':'var(--bg-card)'}">
      <i class="ti ${icon}" style="font-size:17px;color:${file?'#059669':'var(--text-tertiary)'}"></i>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;color:var(--text-primary)">${label} <span style="font-size:10.5px;font-weight:400;color:var(--text-tertiary)">(opsional)</span></div>
        ${file?`<div style="font-size:11px;color:#059669;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><i class="ti ti-paperclip" style="font-size:11px;vertical-align:-1px"></i> ${file}</div>`:`<div style="font-size:11px;color:var(--text-tertiary)">Belum diunggah</div>`}

      ${file

function kycUploadDoc(id,key,input){
  const f=input.files&&input.files[0]; if(!f) return;
  const i=investorsReg.find(x=>x.id===id); if(!i) return;
  i.docs=i.docs||{}; i.docs[key]=f.name;
  const lbl=(KYC_DOCS.find(d=>d[0]===key)||[])[1]||key;
  auditLog.unshift({actor:ME.name,role:'Admin',aksi:`Mengunggah ${lbl} untuk ${i.name}`,tgl:'Baru saja',icon:'ti-upload',col:'#4338CA'});
  Store.commit(); openKyc(id);
}
function kycRemoveDoc(id,key){
  const i=investorsReg.find(x=>x.id===id); if(!i||!i.docs) return;
  delete i.docs[key];
  Store.commit(); openKyc(id);
}
function approveKyc(id){ const i=investorsReg.find(x=>x.id===id); i.kyc='Terverifikasi'; const u=users.find(x=>x.email===i.email); if(u){u.status='Aktif'; u.scope='Terverifikasi';} auditLog.unshift({actor:ME.name,role:'Admin',aksi:`Memverifikasi KYC investor ${i.name}`,tgl:'Baru saja',icon:'ti-user-check',col:'#4338CA'}); closeModalForce(); render(); toast('KYC terverifikasi — investor diaktifkan'); }
function rejectKyc(id){ const i=investorsReg.find(x=>x.id===id); i.kyc='Ditolak'; closeModalForce(); render(); toast('KYC ditolak'); }

  DOC_TIPE.forEach(t=>h+=`<option ${doc&&doc.tipe===t?'selected':''}>${t}</option>`);
  h+=`</select></div>`;
  h+=`<div class="form-field"><div class="form-label">Versi</div><input class="form-input" id="doc-versi" value="${doc?doc.versi:'v1.0'}" placeholder="v1.0"></div>`;
  h+=`<div class="form-field"><div class="form-label">Tanggal dokumen</div><input class="form-input" id="doc-tgl" value="${doc?doc.tgl:''}" placeholder="1 Jan 2025"></div>`;
  h+=`</div>`;
  h+=`<div class="form-field full" style="margin-top:10px"><div class="form-label">Upload file</div>`;
  h+=`<div style="display:flex;align-items:center;gap:8px">`;
  h+=`<input class="form-input" id="doc-file" value="${doc?doc.size:''}" placeholder="Klik 'Pilih file' atau ketik nama file" style="flex:1">`;
  h+=`<label style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--bg-secondary);color:var(--text-secondary);white-space:nowrap" onclick="document.getElementById('doc-file').value='dokumen-baru-'+(new Date().getTime()%10000)+'.pdf (1.2 MB)'"><i class="ti ti-upload"></i>Pilih file</label>`;
  h+=`</div></div>`;
  h+=`<div class="btn-row"><button class="btn btn-secondary" onclick="closeModalForce()">Batal</button><button class="btn btn-primary" onclick="saveDoc('${id||''}')"><i class="ti ti-check"></i>${doc?'Simpan perubahan':'Upload dokumen'}</button></div>`;
  openModal(h);
}
function saveDoc(id){
  const nama=document.getElementById('doc-nama').value.trim()||'Dokumen baru';
  const pid=document.getElementById('doc-pid').value;
  const tipe=document.getElementById('doc-tipe').value;
  const versi=document.getElementById('doc-versi').value.trim()||'v1.0';
  const tgl=document.getElementById('doc-tgl').value.trim()||nowStr();
  const fileRaw=document.getElementById('doc-file').value.trim()||'1.0 MB';
  const size=fileRaw.includes('MB')||fileRaw.includes('KB')?fileRaw.split('(').pop().replace(')','').trim():'1.0 MB';
  if(id){
    const doc=documents.find(x=>x.id===id);
    Object.assign(doc,{nama,pid,tipe,versi,tgl,size});
    auditLog.unshift({actor:ME.name,role:'Admin',aksi:`Update dokumen: ${nama} (${tipe} · ${versi})`,tgl:'Baru saja',icon:'ti-file-pencil',col:'#4338CA'});
    toast('Dokumen diperbarui');
  } else {
    documents.unshift({id:'d'+(documents.length+1),pid,nama,tipe,versi,tgl,size});
    auditLog.unshift({actor:ME.name,role:'Admin',aksi:`Upload dokumen baru: ${nama} (${tipe})`,tgl:'Baru saja',icon:'ti-file-plus',col:'#4338CA'});
    toast('Dokumen berhasil diupload');
  }
  closeModalForce(); render();
}
function deleteDoc(id){
  const doc=documents.find(x=>x.id===id);
  if(!doc) return;
  if(!confirm(`Hapus "${doc.nama}"? Tindakan ini tidak bisa dibatalkan.`)) return;
  documents.splice(documents.indexOf(doc),1);
  auditLog.unshift({actor:ME.name,role:'Admin',aksi:`Menghapus dokumen: ${doc.nama}`,tgl:'Baru saja',icon:'ti-trash',col:'#DC2626'});
  render(); toast('Dokumen dihapus');
}

// ── Bagi Hasil Config ──────────────────────────────────────
function openBhModal(pid){
  const p=getP(pid); const cfg=bhConfig[pid]||{skema:'Fixed return',basis:'',frekuensi:'Bulanan',cap:'Tidak ada',minimum:'Tidak ada'};
  let h=`<div class="modal-title">Pengaturan bagi hasil</div><div class="modal-sub">${p?p.name:pid}</div>`;
  h+=`<div class="form-grid">`;
  h+=`<div class="form-field"><div class="form-label">Skema bagi hasil</div><select class="form-input" id="bh-skema">${BH_SKEMA.map(s=>`<option ${cfg.skema===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
  h+=`<div class="form-field"><div class="form-label">Frekuensi pembayaran</div><select class="form-input" id="bh-frek"><option ${cfg.frekuensi==='Bulanan'?'selected':''}>Bulanan</option><option ${cfg.frekuensi.startsWith('Bulanan +')?'selected':''}>Bulanan + triwulanan</option><option ${cfg.frekuensi==='Triwulanan'?'selected':''}>Triwulanan</option><option ${cfg.frekuensi==='Semesteran'?'selected':''}>Semesteran</option><option ${cfg.frekuensi==='Tahunan'?'selected':''}>Tahunan</option></select></div>`;
  h+=`</div>`;
  h+=`<div class="form-field full" style="margin-top:10px"><div class="form-label">Basis perhitungan</div><textarea class="form-input" id="bh-basis" style="min-height:56px" placeholder="Mis. 10,5% p.a. dari nominal pokok">${cfg.basis}</textarea></div>`;
  h+=`<div class="form-grid" style="margin-top:8px">`;
  h+=`<div class="form-field"><div class="form-label">Cap return</div><input class="form-input" id="bh-cap" value="${cfg.cap}" placeholder="Mis. 15% p.a. atau 'Tidak ada'"></div>`;
  h+=`<div class="form-field"><div class="form-label">Return minimum (jaminan)</div><input class="form-input" id="bh-min" value="${cfg.minimum}" placeholder="Mis. 10% p.a. dijamin atau 'Tidak ada'"></div>`;
  h+=`</div>`;
  h+=`<label class="form-field full" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:11px 13px;margin-top:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg-secondary)"><input type="checkbox" id="bh-pokok"${p&&p.pengembalianPokok?' checked':''} style="width:16px;height:16px;margin-top:1px;accent-color:var(--navy);cursor:pointer"><span><span style="font-size:13px;font-weight:600;color:var(--text-primary)">Ada pengembalian pokok</span><br><span style="font-size:11px;color:var(--text-tertiary)">Pokok investor dikembalikan di akhir kontrak. Jika tidak dicentang, annualized yield di BA-PM disesuaikan −20% (tanpa pokok).</span></span></label>`;
  h+=`<div class="btn-row"><button class="btn btn-secondary" onclick="closeModalForce()">Batal</button><button class="btn btn-primary" onclick="saveBhConfig('${pid}')"><i class="ti ti-check"></i>Simpan konfigurasi</button></div>`;
  openModal(h);
}
function saveBhConfig(pid){
  const skema=document.getElementById('bh-skema').value;
  const basis=document.getElementById('bh-basis').value.trim()||'—';
  const frekuensi=document.getElementById('bh-frek').value;
  const cap=document.getElementById('bh-cap').value.trim()||'Tidak ada';
  const minimum=document.getElementById('bh-min').value.trim()||'Tidak ada';
  const pokok=document.getElementById('bh-pokok').checked;
  bhConfig[pid]={skema,basis,frekuensi,cap,minimum};
  const p=getP(pid);
  if(p) p.pengembalianPokok=pokok;
  auditLog.unshift({actor:ME.name,role:'Admin',aksi:`Update pengaturan bagi hasil ${p?p.name:pid} → ${skema} · pokok: ${pokok?'ada':'tidak ada'}`,tgl:'Baru saja',icon:'ti-percentage',col:'#4338CA'});
  closeModalForce(); render(); toast('Konfigurasi bagi hasil disimpan');
}

function openAnnounce(){
  let h=`<div class="modal-title">Buat pengumuman</div><div class="modal-sub">Kirim ke pengguna platform</div>`;
  h+=`<div class="form-field full"><div class="form-label">Judul</div><input class="form-input" id="an-judul" placeholder="Judul pengumuman"></div>`;
  h+=`<div class="form-field full" style="margin-top:10px"><div class="form-label">Target</div><select class="form-input" id="an-target"><option>Semua</option><option>BA-PM</option><option>Investor</option></select></div>`;
  h+=`<div class="form-field full" style="margin-top:10px"><div class="form-label">Isi</div><textarea class="form-input" id="an-isi" placeholder="Tulis pesan..."></textarea></div>`;
  h+=`<div class="btn-row"><button class="btn btn-secondary" onclick="closeModalForce()">Batal</button><button class="btn btn-primary" onclick="saveAnnounce()"><i class="ti ti-send"></i>Kirim</button></div>`;
  openModal(h);
}
function saveAnnounce(){
  const judul=document.getElementById('an-judul').value.trim()||'Pengumuman tanpa judul';
  const target=document.getElementById('an-target').value;
  const isi=document.getElementById('an-isi').value.trim()||'—';
  announcements.unshift({id:'an'+(announcements.length+1),judul,target,tgl:nowStr(),status:'Terkirim',isi});
  closeModalForce(); render(); toast('Pengumuman terkirim ke '+target);
}

function saveRules(){
  ['siaga1Hari','siaga2Hari','siaga3Hari','siaga1VakumHari','siaga2VakumHari','siaga3VakumHari','siaga1PerfBulan','siaga2PerfBulan','siaga3PerfBulan','contractWarn','contractCrit'].forEach(k=>{ const el=document.getElementById('rule-'+k); if(el) healthRules[k]=parseFloat(el.value)||0; });
  auditLog.unshift({actor:ME.name,role:'Admin',aksi:'Memperbarui aturan health SOP Wanprestasi',tgl:'Baru saja',icon:'ti-shield-check',col:'#4338CA'});
  Store.commit(); toast('Aturan health SOP disimpan — berlaku ke semua portfolio aktif');
}

function nowStr(){ return '17 Jun 2024'; }

// ============================================================
// ROUTER
// ============================================================
function renderContent(){
  const map={dashboard:pageDashboard,users:pageUsers,companies:pageCompanies,investors:pageInvestors,approvals:pageApprovals,distribusi:pageDistribusi,dokumen:pageDocuments,'bh-config':pageBhConfig,fees:pageFees,rules:pageRules,audit:pageAudit,announce:pageAnnounce,settings:pageSettings};
  document.getElementById('content').innerHTML=(map[ST.page]||pageDashboard)();
}
function render(){ renderSidebar(); renderTopbar(); renderContent(); if(!_applyingRemote) Store.commit(); }
function nav(id){ ST.page=id; render(); window.scrollTo&&window.scrollTo(0,0); const cw=document.querySelector('.content-wrap'); if(cw) cw.scrollTop=0; }

render();
</script>

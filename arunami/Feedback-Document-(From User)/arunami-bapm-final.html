<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arunami BA-PM Platform — Prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #F3F4F6; color: #111827; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, select, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid #2563EB; outline-offset: 1px; }

:root {
  --navy: #0F2744; --navy-hover: rgba(255,255,255,0.07); --navy-active: rgba(255,255,255,0.13);
  --navy-border: rgba(255,255,255,0.09); --navy-text: #C8D8EB; --navy-muted: #7A96B3;
  --bg-page: #F3F4F6; --bg-card: #FFFFFF; --bg-secondary: #F9FAFB; --bg-tertiary: #F3F4F6;
  --border: #E5E7EB; --border-light: #F3F4F6;
  --text-primary: #111827; --text-secondary: #6B7280; --text-tertiary: #9CA3AF;
  --text-success: #059669; --text-danger: #DC2626; --text-warning: #D97706; --text-info: #2563EB;
  --bg-success: #ECFDF5; --bg-danger: #FEF2F2; --bg-warning: #FFFBEB; --bg-info: #EFF6FF;
  --sidebar-w: 228px; --topbar-h: 52px; --content-max: 1100px;
  --shadow-xs: 0 1px 2px rgba(16,24,40,0.04);
  --shadow-sm: 0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
  --shadow-md: 0 4px 12px rgba(16,24,40,0.08);
  --ring: 0 0 0 3px rgba(37,99,235,0.12);
}

.app { display: flex; height: 100vh; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; z-index: 10; }
.sb-logo { padding: 18px 18px 14px; border-bottom: 1px solid var(--navy-border); flex-shrink: 0; }
.sb-logo-name { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: 0.01em; }
.sb-logo-role { font-size: 11px; color: var(--navy-muted); margin-top: 1px; }
.sb-back { display: flex; align-items: center; gap: 6px; padding: 10px 18px 8px; color: var(--navy-muted); font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--navy-border); flex-shrink: 0; transition: color 0.15s; }
.sb-back:hover { color: #fff; }
.sb-pctx { padding: 10px 18px 10px; border-bottom: 1px solid var(--navy-border); flex-shrink: 0; }
.sb-pname { font-size: 13px; font-weight: 500; color: #fff; margin-bottom: 5px; }
.sb-nav { flex: 1; overflow-y: auto; padding: 6px 0 8px; }
.sb-nav::-webkit-scrollbar { width: 3px; }
.sb-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
.sb-section { font-size: 10px; font-weight: 600; color: var(--navy-muted); letter-spacing: 0.09em; text-transform: uppercase; padding: 10px 18px 4px; }
.sb-item { display: flex; align-items: center; gap: 9px; padding: 7px 18px 7px 15px; cursor: pointer; color: var(--navy-text); font-size: 13px; transition: background 0.1s, color 0.1s; border-left: 3px solid transparent; }
.sb-item:hover { background: var(--navy-hover); color: #fff; }
.sb-item.active { background: var(--navy-active); color: #fff; border-left-color: #60A5FA; }
.sb-item i { font-size: 16px; flex-shrink: 0; opacity: 0.8; }
.sb-item.active i { opacity: 1; }
.sb-item-label { flex: 1; }
.sb-badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px; line-height: 1.5; }
.sb-badge-n { background: rgba(217,119,6,0.3); color: #FCD34D; }
.sb-badge-a { background: rgba(220,38,38,0.3); color: #FCA5A5; }
.sb-divider { height: 1px; background: var(--navy-border); margin: 5px 18px; }
.sb-meeting-btn { margin: 8px 12px 4px; padding: 9px 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13); border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.15s; flex-shrink: 0; }
.sb-meeting-btn:hover { background: rgba(255,255,255,0.13); }
.sb-user { padding: 11px 14px; border-top: 1px solid var(--navy-border); display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.sb-avatar { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0; }
.sb-user-info { flex: 1; min-width: 0; }
.sb-user-name { font-size: 12px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-user-role { font-size: 10px; color: var(--navy-muted); }

/* HEALTH */
.hbadge { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 9px; border-radius: 99px; font-weight: 600; }
.hb-sehat { background: rgba(5,150,105,0.15); color: #10B981; }
.hb-siaga1 { background: rgba(217,119,6,0.15); color: #D97706; }
.hb-siaga2 { background: rgba(234,88,12,0.15); color: #EA580C; }
.hb-siaga3 { background: rgba(220,38,38,0.15); color: #EF4444; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar { height: var(--topbar-h); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 28px; background: var(--bg-card); flex-shrink: 0; gap: 8px; box-shadow: var(--shadow-xs); position: relative; z-index: 5; }
.topbar-title { font-size: 16px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
.topbar-sep { color: var(--text-tertiary); font-size: 12px; }
.topbar-ctx { font-size: 13px; color: var(--text-secondary); }
.content-wrap { flex: 1; overflow-y: auto; background: var(--bg-page); }
.content-wrap::-webkit-scrollbar { width: 8px; }
.content-wrap::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 99px; border: 2px solid var(--bg-page); }
.content-wrap::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
.content-inner { max-width: var(--content-max); margin: 0 auto; padding: 24px 28px 40px; animation: contentIn 0.2s ease; }
@keyframes contentIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* MEETING MODE - full screen overlay */
.meeting-screen { position: fixed; inset: 0; background: #0a1e33; z-index: 200; display: flex; flex-direction: column; }
.meeting-topbar { height: 56px; background: var(--navy); border-bottom: 1px solid var(--navy-border); display: flex; align-items: center; padding: 0 24px; gap: 16px; flex-shrink: 0; }
.meeting-body { flex: 1; display: flex; overflow: hidden; }
.meeting-sidebar { width: 260px; background: #0d2238; border-right: 1px solid var(--navy-border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
.meeting-content { flex: 1; overflow-y: auto; padding: 0; background: #0f2030; }
.meeting-content-inner { max-width: 1280px; margin: 0 auto; padding: 24px 32px 32px; }
.meeting-card:last-child { margin-bottom: 0; }
.meeting-content::-webkit-scrollbar { width: 6px; }
.meeting-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
.meeting-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.meeting-card-title { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.06em; }
.m-agenda-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; transition: background 0.1s; }
.m-agenda-item:hover { background: rgba(255,255,255,0.05); }
.m-agenda-item.active { background: rgba(255,255,255,0.1); }
.m-agenda-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.m-note-input { width: 100%; padding: 9px 11px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #fff; font-size: 13px; resize: vertical; min-height: 52px; outline: none; font-family: inherit; box-sizing: border-box; }
.m-note-input:focus { border-color: rgba(255,255,255,0.3); }
.m-note-item { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
.m-kpi { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 10px 14px; }
.m-btn { padding: 7px 14px; border-radius: 7px; font-size: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; transition: background 0.1s; }
.m-btn:hover { background: rgba(255,255,255,0.15); }
.m-btn-primary { background: #1e5fa8; border-color: #2563EB; }
.m-btn-primary:hover { background: #2563EB; }
.m-select { padding:5px 9px; border-radius:7px; font-size:12px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; cursor:pointer; outline:none; }
.m-select option { background:#0F2744; color:#fff; }
.m-ai-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
.m-ai-item:last-child { border-bottom: none; }

/* CARDS */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow-xs); }
.card-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
.card-sub { font-size: 11px; color: var(--text-tertiary); }

/* KPI */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow-xs); transition: border-color 0.15s, box-shadow 0.15s; }
.kpi-card:hover { border-color: #D1D5DB; box-shadow: var(--shadow-sm); }
.kpi-label { font-size: 10px; color: var(--text-tertiary); font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
.kpi-value { font-size: 21px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi-delta { font-size: 11px; margin-top: 4px; font-weight: 500; }
.delta-up { color: var(--text-success); } .delta-dn { color: var(--text-danger); } .delta-neu { color: var(--text-secondary); }

/* TABLE */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--text-tertiary); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border-light); color: var(--text-primary); font-variant-numeric: tabular-nums; }
.tbl tbody tr { transition: background 0.1s; }
.tbl tbody tr:hover { background: var(--bg-secondary); }
.tbl tr:last-child td { border-bottom: none; }
.tbl .muted { color: var(--text-secondary); } .tbl .pos { color: var(--text-success); } .tbl .neg { color: var(--text-danger); }
.tbl .total-row td { font-weight: 600; background: var(--bg-secondary); }

/* TABS */
.tab-row { display: flex; gap: 2px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 9px; padding: 3px; margin-bottom: 18px; width: fit-content; }
.tab { padding: 6px 16px; border-radius: 7px; font-size: 13px; cursor: pointer; color: var(--text-secondary); transition: background 0.15s, color 0.15s, box-shadow 0.15s; user-select: none; }
.tab:hover { color: var(--text-primary); }
.tab.active { background: var(--bg-card); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow-sm); }
.seg { display: inline-flex; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg-btn { padding: 5px 13px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text-secondary); border: none; background: transparent; transition: background 0.15s, color 0.15s; }
.seg-btn:hover { color: var(--text-primary); }
.seg-btn.active { background: var(--bg-card); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow-xs); }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: background 0.15s, box-shadow 0.15s, transform 0.1s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--navy); color: #fff; box-shadow: var(--shadow-xs); }
.btn-primary:hover { background: #1a3a5c; box-shadow: var(--shadow-sm); }
.btn-secondary { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); box-shadow: var(--shadow-xs); }
.btn-secondary:hover { background: var(--bg-secondary); color: var(--text-primary); }
.btn-sm { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; font-size: 12px; font-weight: 500; border-radius: 7px; cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); transition: background 0.1s, color 0.1s, border-color 0.1s; box-shadow: var(--shadow-xs); }
.btn-sm:hover { background: var(--bg-secondary); color: var(--text-primary); border-color: #D1D5DB; }
.btn-navy-sm { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; font-size: 12px; font-weight: 500; border-radius: 7px; cursor: pointer; border: 1px solid var(--navy); background: var(--navy); color: #fff; transition: background 0.15s; box-shadow: var(--shadow-xs); }
.btn-navy-sm:hover { background: #1a3a5c; }
.btn-row { display: flex; gap: 8px; margin-top: 16px; }

/* FORMS */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.form-input { padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--bg-card); color: var(--text-primary); outline: none; width: 100%; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: var(--shadow-xs); }
.form-input:hover { border-color: #D1D5DB; }
.form-input:focus { border-color: #2563EB; box-shadow: var(--ring); }
.form-input::placeholder { color: var(--text-tertiary); }
.form-input[readonly] { background: var(--bg-secondary); color: var(--text-secondary); }
select.form-input { cursor: pointer; }
.form-sec-lbl { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.07em; margin: 16px 0 9px; }

/* PILLS */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.pill-read { background: #ECFDF5; color: #059669; }
.pill-unread { background: #FFFBEB; color: #D97706; }
.pill-unsent { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
.pill-draft { background: #FFFBEB; color: #D97706; }
.pill-published { background: #ECFDF5; color: #059669; }
.pill-open { background: #FEF2F2; color: #DC2626; }
.pill-inprog { background: #FFFBEB; color: #D97706; }
.pill-closed { background: #ECFDF5; color: #059669; }
.pill-overdue { background: #FEF2F2; color: #DC2626; }
.pill-pending { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
.pill-selesai { background: #ECFDF5; color: #059669; }

/* BANNERS */
.notif-bar { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 9px; padding: 11px 15px; display: flex; align-items: flex-start; gap: 9px; margin-bottom: 14px; font-size: 12px; color: #92400E; line-height: 1.55; }
.notif-bar i { margin-top: 1px; }
.info-bar { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 9px; padding: 13px 16px; margin-bottom: 14px; font-size: 12px; color: #1E40AF; }
.info-bar-title { font-size: 12px; font-weight: 600; color: #1E3A8A; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
.info-bar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 16px; }
.info-bar-item { display: flex; flex-direction: column; gap: 1px; }
.info-bar-lbl { font-size: 10px; font-weight: 600; color: #3B82F6; text-transform: uppercase; letter-spacing: 0.06em; }
.info-bar-val { font-size: 12px; color: #1E3A8A; font-weight: 500; }
.info-bar-note { font-size: 11px; color: #3B82F6; margin-top: 8px; padding-top: 8px; border-top: 1px solid #BFDBFE; }
.alert-bar { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 9px; padding: 11px 15px; display: flex; align-items: flex-start; gap: 9px; margin-bottom: 14px; font-size: 12px; color: #991B1B; line-height: 1.55; }
.alert-bar i { margin-top: 1px; }

/* PROGRESS */
.prog-row { margin-bottom: 13px; }
.prog-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
.prog-bar-bg { height: 7px; background: var(--bg-tertiary); border-radius: 99px; overflow: hidden; }
.prog-bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s cubic-bezier(0.16,1,0.3,1); }

/* UPLOAD */
.upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 24px; text-align: center; margin-bottom: 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.upload-area:hover { border-color: #2563EB; background: var(--bg-info); }

/* CHART */
.chart-wrap { width: 100%; margin-bottom: 6px; }
.chart-legend { display: flex; gap: 16px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* HEALTH TOOLTIP */
.health-tooltip { border-radius: 10px; padding: 12px 15px; margin-bottom: 14px; }

/* ENGAGE SUMMARY */
.engage-summary { display: flex; gap: 12px; margin-bottom: 16px; }
.es-item { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; box-shadow: var(--shadow-xs); }
.es-num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.es-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }

/* INV ROW */
.inv-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.inv-row:last-child { border-bottom: none; }
.inv-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-info); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text-info); flex-shrink: 0; }

/* STEPPER */
.lap-stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
.step-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.step-active { background: var(--navy); color: #fff; }
.step-done { background: #ECFDF5; color: #059669; }
.step-idle { background: var(--bg-secondary); color: var(--text-tertiary); border: 1px solid var(--border); }
.step-line { flex: 1; height: 1px; background: var(--border); }
.lap-preview-card { border: 1px solid var(--border); border-radius: 9px; padding: 13px 15px; margin-bottom: 9px; cursor: pointer; transition: border-color 0.15s; }
.lap-preview-card:hover { border-color: #93C5FD; }
.lap-preview-card.selected { border-color: #2563EB; background: #EFF6FF; }

/* DASHBOARD */
.health-strip { display: flex; gap: 12px; margin-bottom: 18px; }
.hs-item { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: var(--shadow-xs); }
.hs-item:hover { border-color: #93C5FD; box-shadow: var(--shadow-sm); }
.hs-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.hs-num { font-size: 24px; font-weight: 700; color: var(--text-primary); }
.hs-lbl { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
.alert-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--shadow-xs); }
.alert-panel-hdr { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.alert-count-badge { font-size: 11px; font-weight: 600; background: #FEF2F2; color: var(--text-danger); padding: 2px 8px; border-radius: 99px; }
.alert-item { display: flex; align-items: flex-start; gap: 11px; padding: 9px 0; border-top: 1px solid var(--border-light); cursor: pointer; }
.alert-item:hover .alert-item-title { color: var(--text-info); }
.alert-sev-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.alert-item-title { font-size: 13px; font-weight: 500; color: var(--text-primary); }

// Hitung berapa bulan berturut net profit < 80% dari target (dari MONTHLY_ROWS + PROJ_TARGETS)
function computePerfBulan(pid){
  const kodeMap={nexavar:'NX',solaris:'SA',kirana:'KN',biru:'BS'};
  const kode=kodeMap[pid]; if(!kode) return 0;
  const tgt=PROJ_TARGETS[kode]; if(!tgt||!tgt.np) return 0;
  const targetNp=parseFloat(tgt.np.replace('M',''));
  if(!targetNp) return 0;
  const rows=MONTHLY_ROWS.filter(r=>r.kode===kode&&r.np!=null).sort((a,b)=>b.ts-a.ts);
  let count=0;
  for(const r of rows){
    const actualNp=parseFloat(r.np.replace('M',''));
    if(isNaN(actualNp)) break;
    if(actualNp < targetNp*0.8) count++; else break;
  }
  return count;
}

function computeHealth(pid){
  const p=portfolios.find(x=>x.id===pid)||{};
  // 1. Keterlambatan bayar/lapor — diinput manual oleh BA-PM
  const hari=p.keterlambatanHari||0;
  // 2. Vakum komunikasi — auto dari lastKontakTgl vs hari ini
  const today=new Date('2026-06-17');
  const lastK=p.lastKontakTgl?new Date(p.lastKontakTgl):today;
  const vakum=Math.max(0,Math.floor((today-lastK)/86400000));
  // 3. Performa net profit vs target — auto dari MONTHLY_ROWS
  const perf=computePerfBulan(pid);
  // Simpan nilai computed ke p agar bisa ditampilkan di UI
  p.komVakumHari=vakum; p.performaBulan=perf;
  if(hari>healthConfig.siaga3Hari||vakum>healthConfig.siaga3VakumHari||perf>=healthConfig.siaga3PerfBulan) return 'Siaga 3';
  if(hari>healthConfig.siaga2Hari||vakum>=healthConfig.siaga2VakumHari||perf>=healthConfig.siaga2PerfBulan) return 'Siaga 2';
  if(hari>healthConfig.siaga1Hari||vakum>=healthConfig.siaga1VakumHari||perf>=healthConfig.siaga1PerfBulan) return 'Siaga 1';
  return 'Sehat';
}

function miniSVG(aktual, plan, labels, colorA, colorB){
  const W=480,H=130,pl=34,pr=12,pt=12,pb=28,cw=W-pl-pr,ch=H-pt-pb,n=aktual.length;
  const maxV=Math.max(...aktual,...plan)*1.12;
  const xp=i=>pl+i*(cw/(n-1)), yp=v=>pt+ch-(v/maxV)*ch;
  let pP=`M${xp(0)},${yp(plan[0])}`, aP=`M${xp(0)},${yp(aktual[0])}`;
  for(let i=1;i<n;i++){ pP+=` L${xp(i)},${yp(plan[i])}`; aP+=` L${xp(i)},${yp(aktual[i])}`; }
  let g='',xl='';
  [0,0.5,1].forEach(f=>{ const y=pt+ch*(1-f); g+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="#E5E7EB" stroke-width="0.8"/>`; });
  [0,2,4,6,8,n-1].forEach(i=>{ if(i<n) xl+=`<text x="${xp(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#9CA3AF">${labels[i]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">${g}<path d="${pP}" fill="none" stroke="${colorB}" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.55"/><path d="${aP}" fill="none" stroke="${colorA}" stroke-width="2.2"/>${xl}</svg>`;
}

function pagePortRingkasan(){
  var fStatus  = ST.portFilter   || '';
  var fIndustri= ST.portIndustri || '';
  var fTahap   = ST.portTahap    || '';
  var fSearch  = (ST.portSearch  || '').toLowerCase();

  var filtered = portfolios.filter(function(p){
    var ms = !fStatus   || p.health.toLowerCase()===fStatus;
    var mi = !fIndustri || p.industri===fIndustri;
    var mt = !fTahap    || p.tahap===fTahap;
    var mq = !fSearch   || p.name.toLowerCase().includes(fSearch)
                        || p.kode.toLowerCase().includes(fSearch)
                        || p.pt.toLowerCase().includes(fSearch)
                        || p.industri.toLowerCase().includes(fSearch);
    return ms&&mi&&mt&&mq;
  });

  var industriList = [...new Set(portfolios.map(p=>p.industri))].sort();
  var tahapList    = [...new Set(portfolios.map(p=>p.tahap))].sort();
  var hasFilter    = fStatus||fIndustri||fTahap||fSearch;

  var h='<div class="filter-row" style="align-items:center;margin-bottom:14px">';
  // Search
  h+='<input type="text" class="filter-select" placeholder="Cari nama, kode, PT…" style="min-width:180px;flex:1" value="'+ST.portSearch+'" oninput="setPortSearch(this.value)">';
  // Industri
  h+='<select class="filter-select" onchange="setPortIndustri(this.value)">';
  h+='<option value="">Semua industri</option>';
  industriList.forEach(function(i){ h+='<option value="'+i+'"'+(fIndustri===i?' selected':'')+'>'+i+'</option>'; });
  h+='</select>';
  // Tahap
  h+='<select class="filter-select" onchange="setPortTahap(this.value)">';
  h+='<option value="">Semua tahap</option>';
  tahapList.forEach(function(t){ h+='<option value="'+t+'"'+(fTahap===t?' selected':'')+'>'+t+'</option>'; });
  h+='</select>';
  // Status/health
  h+='<select class="filter-select" onchange="setPortFilter(this.value)">';
  h+='<option value="">Semua status</option>';
  [['critical','Critical'],['watch','Watch'],['sehat','Sehat']].forEach(function(s){
    h+='<option value="'+s[0]+'"'+(fStatus===s[0]?' selected':'')+'>'+s[1]+'</option>';
  });
  h+='</select>';
  // Reset + count
  if(hasFilter) h+='<button class="btn-sm" onclick="resetPortFilter()" style="white-space:nowrap;flex-shrink:0"><i class="ti ti-x" style="font-size:11px"></i> Reset</button>';
  h+='<span style="font-size:12px;color:var(--text-tertiary);white-space:nowrap;flex-shrink:0">'+filtered.length+' / '+portfolios.length+' portfolio</span>';
  h+='</div>';

  if(!filtered.length){
    h+='<div class="ph-card"><div class="ph-icon"><i class="ti ti-filter-off"></i></div><div class="ph-title">Tidak ada portfolio yang sesuai filter</div><div class="ph-desc">Coba ubah atau reset filter pencarian.</div></div>';
  } else {
    h+='<div class="port-grid-v2">';
    filtered.forEach(function(p){ h+=portCardHTML(p); });
    h+='</div>';
  }
  return h;
}

  function stVal(label,main,sub,isPos){

    return `<div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:10px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em">${label}</div>
      <div style="font-size:20px;font-weight:700;color:var(--text-primary);line-height:1">${main}</div>
      ${sub!=null?`<div style="font-size:12px;font-weight:500;color:${col}">${sub}</div>`:''}
    </div>`;
  }
  let h=`<div class="card" style="padding:16px 20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <span style="font-size:13px;font-weight:600;color:var(--text-primary)">Ringkasan bulan</span>
    <select class="filter-select" onchange="setRvStatsMonth(this.value)">${stOpts}</select>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-top:14px;border-top:1px solid var(--border-light)">
    ${stVal('Revenue aktual',stRevA.toFixed(2)+'M',`${+stRevV>=0?'+':''}${stRevV}% vs plan`,+stRevV>=0)}
    ${stVal('Revenue plan',revPlan[stIdx].toFixed(1)+'M',null,true)}
    ${stVal('Profit aktual',Math.round(stProfA)+'jt',`${+stProfV>=0?'+':''}${stProfV}% vs plan`,+stProfV>=0)}
    ${stVal('Profit margin',stMargin!=null?stMargin+'%':'—',stRow.np?`Net profit: ${stRow.np}`:null,true)}
  </div></div>`;

  const s=ST.revStart, e=ST.revEnd;
  const mOptsS=months.map((m,i)=>`<option value="${i}"${i===s?' selected':''}>${m}</option>`).join('');
  const mOptsE=months.map((m,i)=>`<option value="${i}"${i===e?' selected':''}>${m}</option>`).join('');
  const rangeFilter=`<div style="display:flex;align-items:center;gap:5px"><select class="filter-select" onchange="setRevStart(+this.value)">${mOptsS}</select><span style="font-size:11px;color:var(--text-tertiary)">—</span><select class="filter-select" onchange="setRevEnd(+this.value)">${mOptsE}</select></div>`;
  const mS=months.slice(s,e+1);
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Revenue aktual vs proyeksi</span><div style="display:flex;align-items:center;gap:8px">${rangeFilter}<span class="card-sub">Rp miliar</span></div></div><div class="chart-wrap">${miniSVG(ra.slice(s,e+1),revPlan.slice(s,e+1),mS,'#2563EB','#9CA3AF')}</div><div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:#2563EB"></div>Aktual</div><div class="legend-item"><div class="legend-dot" style="background:#9CA3AF;opacity:0.6"></div>Proyeksi</div></div></div>`;
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Profit aktual vs proyeksi</span><div style="display:flex;align-items:center;gap:8px">${rangeFilter}<span class="card-sub">Rp juta</span></div></div><div class="chart-wrap">${miniSVG(pa.slice(s,e+1),profPlan.slice(s,e+1),mS,'#059669','#9CA3AF')}</div><div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:#059669"></div>Aktual</div><div class="legend-item"><div class="legend-dot" style="background:#9CA3AF;opacity:0.6"></div>Proyeksi</div></div></div>`;
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Tabel varians per bulan</span><span class="card-sub">${mS[0]}–${mS[mS.length-1]} 2024</span></div><table class="tbl"><thead><tr><th>Bulan</th><th>Rev aktual</th><th>Rev plan</th><th>Varians</th><th>Profit aktual</th><th>Profit plan</th><th>Varians</th></tr></thead><tbody>`;
  mS.forEach((m,j)=>{ const i=s+j; const rA=ra[i],rP=revPlan[i],rv=((rA-rP)/rP*100).toFixed(1),pA=Math.round(pa[i]),pP=profPlan[i],pv=((pA-pP)/pP*100).toFixed(1); h+=`<tr><td>${m}</td><td>${rA.toFixed(2)}M</td><td class="muted">${rP.toFixed(1)}M</td><td class="${rv<0?'neg':'pos'}">${rv>0?'+':''}${rv}%</td><td>${pA}jt</td><td class="muted">${pP}jt</td><td class="${pv<0?'neg':'pos'}">${pv>0?'+':''}${pv}%</td></tr>`; });
  h+=`</tbody></table></div>`;

  // === Yield section ===
  const pid=ST.pid;
  const pp=curP();
  const kodeMap2={nexavar:'NX',solaris:'SA',kirana:'KN',biru:'BS'};
  const kp=kodeMap2[pid];
  // All periods for this portfolio, sorted newest first
  const yldPeriods=MONTHLY_ROWS.filter(r=>r.kode===kp).sort((a,b)=>b.ts-a.ts).map(r=>r.bulan);
  const ymSel=ST.rvYieldMonth||yldPeriods[0];
  const ymRow=MONTHLY_ROWS.find(r=>r.kode===kp&&r.bulan===ymSel)||{};
  const ymVal=ymRow.yield?parseFloat(ymRow.yield):null;
  const ymTarget=healthConfig.yieldTarget;
  const ymDelta=ymVal!=null?(ymVal-ymTarget).toFixed(1):null;
  const ymOpts=yldPeriods.map(pp=>`<option value="${pp}"${pp===ymSel?' selected':''}>${pp}</option>`).join('');

  // Range for average
  const ysIdx=ST.rvYieldStart, yeIdx=ST.rvYieldEnd;
  const yldAll=MONTHLY_ROWS.filter(r=>r.kode===kp).sort((a,b)=>a.ts-b.ts);
  const yldRange=yldAll.slice(ysIdx,yeIdx+1);
  const yldVals=yldRange.map(r=>parseFloat(r.yield||'0')).filter(v=>v>0);
  const avgYld=yldVals.length?yldVals.reduce((a,b)=>a+b,0)/yldVals.length:null;
  const annYld=avgYld!=null?avgYld*12:null;
  const adjYld=annYld!=null?(!pp.pengembalianPokok?annYld*0.8:annYld):null;
  const yRangeOpts=(from)=>yldAll.map((r,i)=>`<option value="${i}"${i===(from?yeIdx:ysIdx)?' selected':''}>${r.bulan}</option>`).join('');
  function yldCell(v,target,suffix='%'){
    if(v==null) return `<span style="color:var(--text-tertiary)">—</span>`;
    const delta=(v-target).toFixed(1);
    const col=v>=target?'#059669':'#DC2626';
    return `<span style="font-size:18px;font-weight:600;color:var(--text-primary)">${v.toFixed(1)}${suffix}</span><span style="margin-left:8px;font-size:12px;font-weight:500;color:${col}">${+delta>=0?'+':''}${delta}% vs target ${target}%</span>`;
  }

  h+=`<div style="font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.06em;margin:20px 0 10px">Analisis Yield</div>`;

  // Monthly yield card
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Yield bulanan</span><select class="filter-select" onchange="setRvYieldMonth(this.value)">${ymOpts}</select></div>
  <div style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div>
      <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Yield ${ymSel}</div>
      <div>${ymVal!=null?yldCell(ymVal,ymTarget):'<span style="color:var(--text-tertiary)">Data tidak tersedia</span>'}</div>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Annualized (ann. field)</div>
      <div style="font-size:18px;font-weight:600;color:var(--text-primary)">${ymRow.ann||'—'}</div>
    </div>
  </div></div>`;

  // Average / Annualized / Adjusted card
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Rata-rata & annualized yield</span><div style="display:flex;align-items:center;gap:5px"><select class="filter-select" onchange="setRvYieldStart(+this.value)">${yRangeOpts(false)}</select><span style="font-size:11px;color:var(--text-tertiary)">—</span><select class="filter-select" onchange="setRvYieldEnd(+this.value)">${yRangeOpts(true)}</select></div></div>
  <div style="padding:16px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
    <div>
      <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Rata-rata yield</div>
      <div>${avgYld!=null?yldCell(avgYld,ymTarget):'<span style="color:var(--text-tertiary)">—</span>'}</div>
      <div style="font-size:11px;color:var(--text-tertiary);margin-top:4px">${yldRange.length} bulan: ${yldRange.map(r=>r.bulan).join(', ')}</div>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Annualized (×12)</div>
      <div>${annYld!=null?yldCell(annYld,ymTarget*12):'<span style="color:var(--text-tertiary)">—</span>'}</div>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Adjusted annualized ${!pp.pengembalianPokok?'<span style="font-size:10px;color:var(--text-tertiary)">(−20%, tanpa pokok)</span>':''}</div>
      <div>${adjYld!=null?yldCell(adjYld,ymTarget*12):'<span style="color:var(--text-tertiary)">—</span>'}</div>
      ${pp.pengembalianPokok?'<div style="font-size:11px;color:#059669;margin-top:4px">Ada pengembalian pokok — tidak dikurangi</div>':''}
    </div>
  </div></div>`;

  return h;
}

function pageBiaya(){
  const pid=ST.pid;
  const ML_PERIODS=['Okt 2024','Sep 2024','Agt 2024','Jul 2024'];
  const bp=ST.biayaPeriod||'Okt 2024', bcp=ST.biayaCmpPeriod;
  function getBiaya(period){
    const kode={nexavar:'NX',solaris:'SA',kirana:'KN',biru:'BS'}[pid];
    const row=MONTHLY_ROWS.find(r=>r.kode===kode&&r.bulan===period);
    if(!row) return null;
    const revJt=parseFloat(row.rev.replace('M','').replace(/\./g,''));
    const structs={
      nexavar:[{n:'Gaji & tunjangan',r:0.22},{n:'Sewa & utilitas',r:0.08},{n:'Pemasaran',r:0.05},{n:'Teknologi & sistem',r:0.07},{n:'Operasional lainnya',r:0.04}],
      solaris:[{n:'Gaji & tunjangan',r:0.18},{n:'Bahan baku & produksi',r:0.28},{n:'Distribusi & logistik',r:0.06},{n:'Pemasaran',r:0.03},{n:'Operasional lainnya',r:0.04}],
      kirana:[{n:'Gaji & tunjangan',r:0.20},{n:'Sewa & utilitas',r:0.09},{n:'Pemasaran',r:0.06},{n:'Inventori & stok',r:0.12},{n:'Operasional lainnya',r:0.05}],
      biru:[{n:'Gaji & tunjangan',r:0.19},{n:'Bahan bakar & armada',r:0.14},{n:'Pemeliharaan aset',r:0.07},{n:'Pemasaran',r:0.03},{n:'Operasional lainnya',r:0.04}],
    };
    return (structs[pid]||structs.nexavar).map(it=>({n:it.n,a:Math.round(revJt*it.r)}));
  }
  const itemsA=getBiaya(bp), itemsB=bcp?getBiaya(bcp):null;
  const pOptsMain=ML_PERIODS.map(pp=>`<option value="${pp}"${pp===bp?' selected':''}>${pp}</option>`).join('');
  const pOptsCmp=`<option value="">Tidak dibandingkan</option>`+ML_PERIODS.map(pp=>`<option value="${pp}"${pp===bcp?' selected':''}>${pp}</option>`).join('');
  let h=`<div class="card"><div class="card-hdr"><span class="card-title">Breakdown biaya operasional</span><div style="display:flex;align-items:center;gap:5px"><select class="filter-select" onchange="setBiayaPeriod(this.value)">${pOptsMain}</select><select class="filter-select" onchange="setBiayaCmpPeriod(this.value)">${pOptsCmp}</select></div></div>`;
  if(!itemsA){
    h+=`<div style="padding:16px;text-align:center;color:var(--text-tertiary);font-size:13px">Data tidak tersedia untuk periode ini.</div>`;
  } else if(itemsB){
    h+=`<table class="tbl"><thead><tr><th>Item biaya</th><th>${bp}</th><th>${bcp}</th><th>Delta</th></tr></thead><tbody>`;
    itemsA.forEach((item,i)=>{
      const b=itemsB[i]; const d=item.a-(b?b.a:0);
      h+=`<tr><td>${item.n}</td><td>Rp ${item.a}jt</td><td class="muted">Rp ${b?b.a:'—'}jt</td><td class="${d>0?'neg':'pos'}">${d>0?'+':''}${d}jt</td></tr>`;
    });
    const tA=itemsA.reduce((s,x)=>s+x.a,0), tB=itemsB.reduce((s,x)=>s+x.a,0), tD=tA-tB;
    h+=`<tr style="font-weight:600;border-top:2px solid var(--border-light)"><td>Total</td><td>Rp ${tA}jt</td><td class="muted">Rp ${tB}jt</td><td class="${tD>0?'neg':'pos'}">${tD>0?'+':''}${tD}jt</td></tr></tbody></table>`;
  } else {
    const tot=itemsA.reduce((s,x)=>s+x.a,0);
    itemsA.forEach(item=>{
      const pct=Math.round(item.a/tot*100);
      h+=`<div class="prog-row"><div class="prog-header"><span style="font-size:13px">${item.n}</span><span style="font-size:12px;color:var(--text-secondary)">Rp ${item.a}jt</span></div><div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%;background:#2563EB"></div></div></div>`;
    });
    h+=`<div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border-light);font-size:13px"><span style="font-weight:600">Total</span><span>Rp ${tot}jt</span></div>`;
  }
  h+=`</div>`;
  return h;
}

function pagePnl(){

    h+=`<div class="btn-row"><button class="btn btn-primary">Simpan data</button><button class="btn btn-secondary">Reset</button></div></div>`;
  } else if(ST.pnlTab==='riwayat'){
    h+=`<div class="card">`;
    months.forEach(function(m,i){
      var o=ST.expMonth===i;
      var expandedRow='';
      if(o){
        expandedRow='<div style="padding:12px;background:var(--bg-secondary);border-radius:8px;margin:4px 0 10px">'
          +'<table class="tbl" style="font-size:12px">'
          +'<tr><td class="muted">Gross revenue</td><td style="text-align:right">'+Math.round(revPlan[i]*1000)+'jt</td></tr>'
          +'<tr><td class="muted">Total COGS</td><td style="text-align:right">'+Math.round(revPlan[i]*1000*0.38)+'jt</td></tr>'
          +'<tr><td class="muted">Gross profit</td><td style="text-align:right">'+Math.round(revPlan[i]*1000*0.62)+'jt</td></tr>'
          +'<tr><td class="muted">Total OpEx</td><td style="text-align:right">'+Math.round(revPlan[i]*1000*0.24)+'jt</td></tr>'
          +'<tr class="total-row"><td>Net profit</td><td style="text-align:right">'+profPlan[i]+'jt</td></tr>'
          +'</table><div style="margin-top:10px"><button class="btn-sm">Edit data bulan ini</button></div></div>';
      }
      h+='<div class="month-row'+(o?' open':'')+'" onclick="toggleMonth('+i+')">'
        +'<span style="font-weight:'+(o?600:400)+'">'+m+' 2024</span>'

  } else if(ST.pnlTab==='struktur'){
    const pid2=ST.pid;
    const kode2={nexavar:'NX',solaris:'SA',kirana:'KN',biru:'BS'}[pid2];
    const ML_PERIODS2=['Okt 2024','Sep 2024','Agt 2024','Jul 2024'];
    const sp=ST.pnlBiayaPeriod||'Okt 2024', scp=ST.pnlBiayaCmpPeriod||'';
    const cogsRatio={nexavar:0.38,solaris:0.52,kirana:0.45,biru:0.40}[pid2]||0.40;
    const opexStructs={
      nexavar:[{n:'Gaji & tunjangan',r:0.22},{n:'Sewa & utilitas',r:0.08},{n:'Pemasaran',r:0.05},{n:'Teknologi & sistem',r:0.07},{n:'Operasional lainnya',r:0.04}],
      solaris:[{n:'Gaji & tunjangan',r:0.18},{n:'Bahan baku & produksi',r:0.28},{n:'Distribusi & logistik',r:0.06},{n:'Pemasaran',r:0.03},{n:'Operasional lainnya',r:0.04}],
      kirana:[{n:'Gaji & tunjangan',r:0.20},{n:'Sewa & utilitas',r:0.09},{n:'Pemasaran',r:0.06},{n:'Inventori & stok',r:0.12},{n:'Operasional lainnya',r:0.05}],
      biru:[{n:'Gaji & tunjangan',r:0.19},{n:'Bahan bakar & armada',r:0.14},{n:'Pemeliharaan aset',r:0.07},{n:'Pemasaran',r:0.03},{n:'Operasional lainnya',r:0.04}],
    };
    function getPnlStruct(period){
      const row=MONTHLY_ROWS.find(r=>r.kode===kode2&&r.bulan===period);
      if(!row) return null;
      const revM=parseFloat(row.rev.replace('M',''));
      const revJt=Math.round(revM*1000);
      const cogsJt=Math.round(revJt*cogsRatio);
      const gpJt=revJt-cogsJt;
      const structs=(opexStructs[pid2]||opexStructs.nexavar).map(it=>({n:it.n,a:Math.round(revJt*it.r)}));
      const opexJt=structs.reduce((s,x)=>s+x.a,0);
      const npJt=row.np?parseInt(row.np.replace('M','')):gpJt-opexJt;
      return {revJt,cogsJt,gpJt,structs,opexJt,npJt,row};
    }
    const sA=getPnlStruct(sp), sB=scp?getPnlStruct(scp):null;
    const pOpts2=ML_PERIODS2.map(pp=>`<option value="${pp}"${pp===sp?' selected':''}>${pp}</option>`).join('');
    const pOptsCmp2=`<option value="">Tidak dibandingkan</option>`+ML_PERIODS2.map(pp=>`<option value="${pp}"${pp===scp?' selected':''}>${pp}</option>`).join('');
    h+=`<div class="card"><div class="card-hdr"><span class="card-title">Struktur biaya PnL</span><div style="display:flex;align-items:center;gap:5px">

      <select class="filter-select" onchange="setPnlBiayaCmpPeriod(this.value)">${pOptsCmp2}</select>
    </div></div>`;
    if(!sA){
      h+=`<div style="padding:16px;text-align:center;color:var(--text-tertiary);font-size:13px">Data tidak tersedia untuk periode ini.</div>`;
    } else {
      function fmtDelta(a,b,inv=false){
        if(b==null) return '';
        const d=a-b, pos=inv?(d<0):(d>=0);
        return `<span style="font-size:11px;margin-left:6px;color:${pos?'#059669':'#DC2626'}">${d>=0?'+':''}${d}jt</span>`;
      }
      function pnlRow(label,aJt,bJt,indent=false,bold=false,isIncome=false){
        const style=`padding:${indent?'5px 16px':'8px 16px'};display:flex;justify-content:space-between;align-items:center;${bold?'font-weight:600;border-top:1px solid var(--border-light);':''}${indent?'background:var(--bg-secondary);':''}`;
        const labelEl=`<span style="font-size:${bold?'13':'12'}px;color:${indent?'var(--text-secondary)':'var(--text-primary)'};${indent?'padding-left:12px;':''}">${label}</span>`;
        const valStyle=`font-size:${bold?'13':'12'}px;color:${isIncome?'#059669':bold?'var(--text-primary)':'var(--text-secondary)'};`;
        return `<div style="${style}">${labelEl}<span style="${valStyle}">Rp ${aJt.toLocaleString()}jt${fmtDelta(aJt,bJt)}</span></div>`;
      }
      if(sB) h+=`<div style="padding:10px 16px 6px;display:flex;gap:20px;font-size:11px;font-weight:600;color:var(--text-tertiary)"><span style="margin-left:auto;min-width:120px;text-align:right">${sp}</span><span style="min-width:60px;text-align:right">${scp}</span></div>`;
      h+=pnlRow('Gross Revenue',sA.revJt,sB?.revJt,false,false,true);
      h+=pnlRow('COGS',sA.cogsJt,sB?.cogsJt,false,false,false);
      h+=pnlRow('Gross Profit',sA.gpJt,sB?.gpJt,false,true,true);
      h+=`<div style="padding:6px 16px 2px;font-size:10px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;background:var(--bg-secondary)">Operating Expenses</div>`;
      sA.structs.forEach((it,i)=>{ h+=pnlRow(it.n,it.a,sB?.structs[i]?.a,true); });
      h+=pnlRow('Total OpEx',sA.opexJt,sB?.opexJt,false,true,false);
      h+=pnlRow('Net Profit',sA.npJt,sB?.npJt,false,true,true);
    }
    h+=`</div>`;
  }
  return h;
}

// Struktur OpEx & rasio COGS (dipakai PnL aktual & Proyeksi plan)
const COGS_RATIO={nexavar:0.38,solaris:0.52,kirana:0.45,biru:0.40};
const OPEX_STRUCTS={
  nexavar:[{n:'Gaji & tunjangan',r:0.22},{n:'Sewa & utilitas',r:0.08},{n:'Pemasaran',r:0.05},{n:'Teknologi & sistem',r:0.07},{n:'Operasional lainnya',r:0.04}],
  solaris:[{n:'Gaji & tunjangan',r:0.18},{n:'Bahan baku & produksi',r:0.28},{n:'Distribusi & logistik',r:0.06},{n:'Pemasaran',r:0.03},{n:'Operasional lainnya',r:0.04}],
  kirana:[{n:'Gaji & tunjangan',r:0.20},{n:'Sewa & utilitas',r:0.09},{n:'Pemasaran',r:0.06},{n:'Inventori & stok',r:0.12},{n:'Operasional lainnya',r:0.05}],
  biru:[{n:'Gaji & tunjangan',r:0.19},{n:'Bahan bakar & armada',r:0.14},{n:'Pemeliharaan aset',r:0.07},{n:'Pemasaran',r:0.03},{n:'Operasional lainnya',r:0.04}],
};
function pageProyeksi(){
  const pid=ST.pid;
  const d=[{b:'Jan',r:2300,p:240,y:10.2},{b:'Feb',r:2400,p:260,y:10.5},{b:'Mar',r:2400,p:255,y:10.3},{b:'Apr',r:2500,p:270,y:10.6},{b:'Mei',r:2600,p:290,y:10.8},{b:'Jun',r:2700,p:295,y:10.9},{b:'Jul',r:2800,p:310,y:11.0},{b:'Agt',r:2900,p:330,y:11.2},{b:'Sep',r:3000,p:340,y:11.3},{b:'Okt',r:3000,p:340,y:11.3},{b:'Nov',r:3100,p:355,y:11.5},{b:'Des',r:3200,p:370,y:11.6}];
  const sel=ST.projMonth||'Okt';
  const cur=d.find(x=>x.b===sel)||d[9];
  const cogsRatio=COGS_RATIO[pid]||0.40;
  const structsDef=OPEX_STRUCTS[pid]||OPEX_STRUCTS.nexavar;
  function buildPnl(row){
    const rev=row.r, cogs=Math.round(rev*cogsRatio), gp=rev-cogs;
    const structs=structsDef.map(it=>({n:it.n,a:Math.round(rev*it.r)}));
    const opex=structs.reduce((s,x)=>s+x.a,0);
    const np=row.p; // net profit target
    return {rev,cogs,gp,structs,opex,np,y:row.y};
  }
  const A=buildPnl(cur);
  // Annualized (jumlah seluruh 12 bulan)
  const sum=d.reduce((acc,row)=>{ const p=buildPnl(row); return {rev:acc.rev+p.rev,cogs:acc.cogs+p.cogs,gp:acc.gp+p.gp,opex:acc.opex+p.opex,np:acc.np+p.np}; },{rev:0,cogs:0,gp:0,opex:0,np:0});

  const monthOpts=d.map(x=>`<option value="${x.b}"${x.b===sel?' selected':''}>${x.b} 2024</option>`).join('');

    const valStyle=`font-size:${bold?'13':'12'}px;color:${isIncome?'#059669':bold?'var(--text-primary)':'var(--text-secondary)'};`;
    return `<div style="${style}">${labelEl}<span style="${valStyle}">Rp ${aJt.toLocaleString()}jt</span></div>`;
  }
  // KPI ringkas
  const grossMargin=(A.gp/A.rev*100).toFixed(1), netMargin=(A.np/A.rev*100).toFixed(1);
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <span style="font-size:13px;font-weight:600;color:var(--text-primary)"><i class="ti ti-target" style="font-size:14px;margin-right:5px;color:var(--text-info)"></i>Proyeksi Plan (PnL) — ${sel} 2024</span>
    <select class="filter-select" onchange="setProjMonth(this.value)">${monthOpts}</select>
  </div>`;
  h+=`<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi-card"><div class="kpi-label">Target revenue</div><div class="kpi-value">Rp ${A.rev.toLocaleString()}jt</div><div class="kpi-delta delta-neu">${sel} 2024</div></div>
    <div class="kpi-card"><div class="kpi-label">Gross margin</div><div class="kpi-value">${grossMargin}%</div><div class="kpi-delta delta-neu">GP Rp ${A.gp.toLocaleString()}jt</div></div>
    <div class="kpi-card"><div class="kpi-label">Net profit</div><div class="kpi-value">Rp ${A.np.toLocaleString()}jt</div><div class="kpi-delta delta-up">Margin ${netMargin}%</div></div>
    <div class="kpi-card"><div class="kpi-label">Target yield</div><div class="kpi-value">${A.y}%</div><div class="kpi-delta delta-neu">Bulanan</div></div>
  </div>`;
  // PnL detail
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Proyeksi laba rugi (PnL) — ${sel} 2024</span><span class="pill ${isPast?'pill-published':'pill-draft'}">${isPast?'Locked':'Aktif'}</span></div>`;
  h+=pnlRow('Gross Revenue',A.rev,false,false,true);
  h+=pnlRow('COGS',A.cogs,false,false,false);
  h+=pnlRow('Gross Profit',A.gp,false,true,true);
  h+=`<div style="padding:6px 16px 2px;font-size:10px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;background:var(--bg-secondary)">Operating Expenses</div>`;
  A.structs.forEach(it=>{ h+=pnlRow(it.n,it.a,true,false,false); });
  h+=pnlRow('Total OpEx',A.opex,false,true,false);
  h+=pnlRow('Net Profit',A.np,false,true,true);
  h+=`<div style="display:flex;justify-content:flex-end;padding:12px 16px 4px"><button class="btn-sm"${isPast?' disabled style="opacity:0.4"':''}><i class="ti ti-pencil" style="font-size:11px"></i> Edit proyeksi bulan ini</button></div>`;
  h+=`</div>`;
  // Annual rollup + target table
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Ringkasan proyeksi tahunan 2024</span><span class="card-sub">Akumulasi 12 bulan</span></div>`;
  h+=pnlRow('Gross Revenue',sum.rev,false,false,true);
  h+=pnlRow('Total COGS',sum.cogs,false,false,false);
  h+=pnlRow('Gross Profit',sum.gp,false,true,true);
  h+=pnlRow('Total OpEx',sum.opex,false,false,false);
  h+=pnlRow('Net Profit',sum.np,false,true,true);
  h+=`</div>`;
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Target bulanan 2024</span><span class="pill pill-published">Aktif</span></div><table class="tbl"><thead><tr><th>Bulan</th><th>Revenue</th><th>Net profit</th><th>Yield</th><th></th></tr></thead><tbody>`;
  d.forEach((r,i)=>{ const past=i<10; const isSel=r.b===sel; h+=`<tr${isSel?' style="background:var(--bg-info)"':''}><td style="cursor:pointer" onclick="setProjMonth('${r.b}')">${r.b}</td><td>${r.r}jt</td><td>${r.p}jt</td><td>${r.y}%</td><td style="text-align:right"><button class="btn-sm"${past?' disabled style="opacity:0.4"':''}>Edit</button></td></tr>`; });
  h+=`</tbody></table><div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border-light);margin-top:6px"><span style="font-size:12px;color:var(--text-tertiary)">Bulan lewat dikunci otomatis</span><button class="btn btn-secondary" style="font-size:12px;padding:6px 14px">+ Tambah periode</button></div></div>`;
  return h;
}

const MONTH_NUM={Jan:1,Feb:2,Mar:3,Apr:4,Mei:5,Jun:6,Jul:7,Agt:8,Sep:9,Okt:10,Nov:11,Des:12};
function _quarterOf(bulan){ const [mon,yr]=bulan.split(' '); return 'Q'+Math.ceil((MONTH_NUM[mon]||1)/3)+' '+yr; }
function _defaultBhFreq(pid){
  const f=(bhKontrak[pid]||{}).frekuensi||'';
  if(/triwulan/i.test(f)&&!/bulan/i.test(f)) return 'Triwulanan';
  return 'Bulanan';
}
function pageBagiHasil(){
  const inv=curInv();
  const sk=bhKontrak[ST.pid]||{};
  const kpBh={nexavar:'NX',solaris:'SA',kirana:'KN',biru:'BS'}[ST.pid];
  const monthRows=MONTHLY_ROWS.filter(r=>r.kode===kpBh).sort((a,b)=>b.ts-a.ts);
  const freq=ST.bhFreq[ST.pid]||_defaultBhFreq(ST.pid);
  const isQuarter=freq==='Triwulanan';

  // Build period list & resolve pool berdasarkan frekuensi
  let periods, bhSel, bhPool;
  if(isQuarter){
    periods=monthRows.reduce((acc,r)=>{ const q=_quarterOf(r.bulan); return acc.includes(q)?acc:[...acc,q]; },[]);
    bhSel=periods.includes(ST.bhMonth)?ST.bhMonth:periods[0];
    bhPool=monthRows.filter(r=>_quarterOf(r.bulan)===bhSel)
      .reduce((s,r)=>s+(r.bh?Math.round(parseFloat(r.bh.replace('M',''))):0),0);
  } else {
    periods=monthRows.map(r=>r.bulan);
    bhSel=periods.includes(ST.bhMonth)?ST.bhMonth:periods[0];
    const bhRow=monthRows.find(r=>r.bulan===bhSel)||{};
    bhPool=bhRow.bh?Math.round(parseFloat(bhRow.bh.replace('M',''))):inv.reduce((s,x)=>s+x.nominal,0);
  }

  const fee=Math.round(bhPool*0.12);
  const sosialOn=!!ST.bhSosialOn[ST.pid];
  const sosialPct=ST.bhSosialPct[ST.pid]!=null?ST.bhSosialPct[ST.pid]:2.5;
  const danaSosial=sosialOn?Math.round(bhPool*sosialPct/100):0;
  const net=bhPool-fee-danaSosial;
  const totNominal=inv.reduce((s,x)=>s+x.nominal,0);
  const divisor=isQuarter?3:1; // ROI bulanan rata-rata dari periode triwulanan
  const periodROI=totNominal>0?(net/totNominal*100).toFixed(2):0;
  const monthlyROI=totNominal>0?(net/totNominal*100/divisor).toFixed(2):0;
  const annROI=(parseFloat(monthlyROI)*12).toFixed(1);

  const bhOpts=periods.map(pp=>`<option value="${pp}"${pp===bhSel?' selected':''}>${pp}</option>`).join('');
  const freqOpts=['Bulanan','Triwulanan','Sesuai kesepakatan'].map(f=>`<option value="${f}"${f===freq?' selected':''}>${f}</option>`).join('');

  let h=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:7px"><span style="font-size:12px;color:var(--text-secondary)">Frekuensi distribusi</span><select class="filter-select" onchange="setBhFreq(this.value)">${freqOpts}</select></div>
    <select class="filter-select" onchange="setBhMonth(this.value)">${bhOpts}</select>
  </div>`;
  if(freq==='Sesuai kesepakatan'){
    h+=`<div class="notif-bar" style="background:var(--bg-info);color:var(--text-info)"><i class="ti ti-calendar-event" style="font-size:15px;flex-shrink:0"></i>Distribusi mengikuti kesepakatan dengan investor (tidak terikat jadwal tetap). Pilih periode acuan lalu konfirmasi tanggal distribusi saat transfer dilakukan.</div>`;
  }
  if(sk.skema){
    h+=`<div class="info-bar">
      <div class="info-bar-title"><i class="ti ti-file-certificate" style="font-size:15px;flex-shrink:0"></i>Skema Bagi Hasil — berdasarkan kontrak</div>
      <div class="info-bar-grid">
        <div class="info-bar-item"><span class="info-bar-lbl">Skema</span><span class="info-bar-val">${sk.skema}</span></div>
        <div class="info-bar-item"><span class="info-bar-lbl">Basis perhitungan</span><span class="info-bar-val">${sk.basis}</span></div>
        <div class="info-bar-item"><span class="info-bar-lbl">Frekuensi distribusi</span><span class="info-bar-val">${sk.frekuensi}</span></div>
        <div class="info-bar-item"><span class="info-bar-lbl">Minimum / jaminan</span><span class="info-bar-val">${sk.minimum}</span></div>
        ${sk.cap&&sk.cap!=='Tidak ada'?`<div class="info-bar-item"><span class="info-bar-lbl">Cap / batas atas</span><span class="info-bar-val">${sk.cap}</span></div>`:''}
      </div>
      ${sk.catatan?`<div class="info-bar-note"><i class="ti ti-info-circle" style="margin-right:5px"></i>${sk.catatan}</div>`:''}
      ${sk.referensi?`<div style="font-size:11px;color:#3B82F6;margin-top:5px"><i class="ti ti-paperclip" style="margin-right:4px"></i>${sk.referensi}</div>`:''}
    </div>`;
  }
  // Kontrol dana sosial (opsional)
  h+=`<div class="card" style="margin-bottom:14px"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <label style="display:flex;align-items:center;gap:9px;cursor:pointer">
      <input type="checkbox" class="cb" ${sosialOn?'checked':''} onchange="setBhSosialOn(this.checked)">
      <span><span style="font-size:13px;font-weight:500;color:var(--text-primary)"><i class="ti ti-heart-handshake" style="font-size:14px;margin-right:5px;color:var(--text-danger)"></i>Dana sosial</span><span style="font-size:11px;color:var(--text-tertiary);display:block;margin-top:1px">Opsional — dipotong dari pool sebelum net untuk investor</span></span>
    </label>
    ${sosialOn?`<div style="display:flex;align-items:center;gap:8px"><input type="number" step="0.1" value="${sosialPct}" onchange="setBhSosialPct(this.value)" style="width:72px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px"><span style="font-size:13px;color:var(--text-secondary)">% dari pool = <strong style="color:var(--text-primary)">Rp ${danaSosial}jt</strong></span></div>`:''}
  </div></div>`;
  const periodTipe=isQuarter?'kuartal':'bulan';
  h+=`<div class="kpi-grid" style="grid-template-columns:repeat(${sosialOn?5:4},1fr)">
    <div class="kpi-card"><div class="kpi-label">Pool bagi hasil</div><div class="kpi-value">Rp ${bhPool>=1000?(bhPool/1000).toFixed(1)+'M':bhPool+'jt'}</div><div class="kpi-delta delta-neu">${bhSel} · sebelum potongan</div></div>

    ${sosialOn?`<div class="kpi-card"><div class="kpi-label">Dana sosial (${sosialPct}%)</div><div class="kpi-value">Rp ${danaSosial}jt</div><div class="kpi-delta delta-neu">Disisihkan</div></div>`:''}
    <div class="kpi-card"><div class="kpi-label">Net untuk investor</div><div class="kpi-value">Rp ${net>=1000?(net/1000).toFixed(1)+'M':net+'jt'}</div><div class="kpi-delta delta-up">Siap didistribusi</div></div>
    <div class="kpi-card"><div class="kpi-label">Monthly ROI rata-rata</div><div class="kpi-value">${monthlyROI}%</div><div class="kpi-delta delta-neu">Annual: ${annROI}%</div></div>
  </div>`;
  h+=`<div class="notif-bar"><i class="ti ti-bell" style="font-size:15px;flex-shrink:0"></i>Distribusi ${bhSel} belum dikonfirmasi — pastikan transfer sudah dilakukan lalu upload bukti.</div>`;
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Distribusi per investor</span><span class="card-sub">${bhSel} · per ${periodTipe}</span></div><table class="tbl"><thead><tr><th>Investor</th><th>Porsi</th><th>Net (Rp juta)</th><th>ROI ${periodTipe}</th><th>Annual ROI</th><th></th></tr></thead><tbody>`;
  inv.forEach(x=>{ const n=Math.round(net*(x.porsi/100)),pr=x.nominal>0?(n/x.nominal*100).toFixed(2):'0.00',ar=(parseFloat(pr)/divisor*12).toFixed(1); h+=`<tr><td><div style="display:flex;align-items:center;gap:9px"><div class="inv-avatar">${x.init}</div>${x.name}</div></td><td class="muted">${x.porsi}%</td><td>${n}jt</td><td class="pos">${pr}%</td><td class="pos">${ar}%</td><td><button class="btn-sm">Upload bukti</button></td></tr>`; });
  h+=`</tbody></table></div>`;
  return h;
}

function pageRenewal(){
  const p=curP(), kritis=p.contractDays<90;
  let h='';
  if(kritis) h+=`<div class="alert-bar"><i class="ti ti-alert-triangle" style="font-size:15px;flex-shrink:0"></i><strong>${p.contractDays} hari tersisa</strong> &nbsp;·&nbsp; Segera ambil keputusan: perpanjang, restrukturisasi, atau exit.</div>`;
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Kontrak ${p.name}</span></div>`;
  h+=`<div class="rl-bar"><div class="rl-segment" style="flex:${kritis?3:1};background:#FEE2E2;color:#DC2626">< 3 bln</div><div class="rl-segment" style="flex:3;background:#FEF3C7;color:#D97706">3–6 bln</div><div class="rl-segment" style="flex:5;background:#ECFDF5;color:#059669">> 6 bln</div></div>`;
  const contracts=[
    {nama:'Perjanjian investasi utama',mulai:'Jan 2022',habis:kritis?'Nov 2024':p.contractDays<180?'Apr 2025':'Okt 2025',sisa:p.contractDays,sev:p.contractDays<90?'c':p.contractDays<180?'w':'s'},
    {nama:'Addendum bagi hasil',mulai:'Jul 2022',habis:'Des 2025',sisa:420,sev:'s'},
    {nama:'Side letter kerahasiaan',mulai:'Jan 2023',habis:'Jan 2026',sisa:460,sev:'s'},
  ];
  h+=`<table class="tbl" style="margin-top:8px"><thead><tr><th>Kontrak</th><th>Mulai</th><th>Berakhir</th><th>Sisa</th><th>Status</th><th>Aksi</th></tr></thead><tbody>`;
  contracts.forEach(c=>{
    const col=c.sev==='c'?'#DC2626':c.sev==='w'?'#D97706':'#059669',bg=c.sev==='c'?'#FEF2F2':c.sev==='w'?'#FFFBEB':'#ECFDF5',lbl=c.sev==='c'?'Kritis':c.sev==='w'?'Segera':'Aman';
    h+=`<tr><td style="font-weight:500">${c.nama}</td><td class="muted">${c.mulai}</td><td>${c.habis}</td><td style="color:${col};font-weight:500">${c.sisa}h</td><td><span class="pill" style="background:${bg};color:${col}">${lbl}</span></td><td><div style="display:flex;gap:5px"><button class="btn-sm">Perpanjang</button><button class="btn-sm">Restrukturisasi</button><button class="btn-sm">Exit</button></div></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

function renderNotesList(items, showPortfolio, addPid){
  const open=items.filter(x=>x.status!=='Closed').length;
  const countLabel = showPortfolio
    ? `${items.length} catatan · <span style="color:var(--text-danger)">${open} open</span>`
    : `${items.length} catatan`;
  const pidArg = addPid||'';
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:13px;font-weight:600;color:var(--text-secondary)">${countLabel}</span><button class="btn btn-primary" style="font-size:12px;padding:7px 14px" onclick="openNoteModal('${pidArg}',null)">+ Tambah catatan</button></div>`;
  if(!items.length){ h+=`<div class="ph-card"><div class="ph-icon"><i class="ti ti-notes"></i></div><div class="ph-title">Belum ada catatan</div><div class="ph-desc">Tambah catatan untuk mendokumentasikan isu atau keputusan penting.</div></div>`; return h; }
  items.forEach(n=>{
    const sc=n.status==='Open'?'pill-open':n.status==='In Progress'?'pill-inprog':'pill-closed';
    const portTag=showPortfolio?` · <span style="color:var(--text-info);cursor:pointer" onclick="openP('${n.pid}')">${n.portfolioName}</span>`:'';
    const isClosed=n.status==='Closed';
    h+=`<div class="note-card"><div class="note-card-hdr"><div><div style="font-size:14px;font-weight:500;color:var(--text-primary)">${n.title}</div><div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">${n.kat} · ${n.date}${portTag}</div></div><span class="pill ${sc}">${n.status}</span></div><div style="font-size:13px;color:var(--text-secondary);line-height:1.6">${n.body}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span style="font-size:11px;color:var(--text-tertiary)">Terakhir diupdate: ${n.date}</span><div style="display:flex;gap:6px"><button class="btn-sm" onclick="openNoteModal('${n.pid}','${n.id}')">Edit</button><button class="btn-sm" onclick="toggleNoteStatus('${n.pid}','${n.id}')">${isClosed?'Buka kembali':'Tutup'}</button></div></div></div>`;
  });
  return h;
}

function renderAIList(items, showPortfolio, addPid){
  const od=items.filter(x=>x.status==='Overdue').length;
  const overdueLabel=od>0?` · <span style="color:var(--text-danger)">${od} overdue</span>`:'';
  const pidArg=addPid||'';
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:13px;font-weight:600;color:var(--text-secondary)">${items.length} action items${overdueLabel}</span><button class="btn btn-primary" style="font-size:12px;padding:7px 14px" onclick="openAIModal('${pidArg}',null)">+ Tambah action item</button></div>`;
  if(!items.length){ h+=`<div class="ph-card"><div class="ph-icon"><i class="ti ti-checkbox"></i></div><div class="ph-title">Belum ada action items</div><div class="ph-desc">Tambah action item untuk mendelegasikan tugas dan memantau progress.</div></div>`; return h; }
  items.forEach(a=>{
    const isOd=a.status==='Overdue', isDone=a.status==='Selesai';
    const sc=isOd?'pill-overdue':a.status==='In Progress'?'pill-inprog':isDone?'pill-selesai':'pill-pending';
    const iconColor=isOd?'#DC2626':isDone?'#059669':'#9CA3AF';
    const portTag=showPortfolio?` · <span style="color:var(--text-info);cursor:pointer" onclick="openP('${a.pid}')">${a.portfolioName}</span>`:'';
    const doneBtn=isDone
      ?`<button class="btn-sm" onclick="setAIReopen('${a.pid}','${a.id}')">Buka kembali</button>`
      :`<button class="btn-sm" onclick="setAISelesai('${a.pid}','${a.id}')">Selesai</button>`;
    h+=`<div class="action-card${isOd?' overdue':''}"><div style="padding-top:2px"><i class="ti ti-${isDone?'circle-check':'circle'}" style="font-size:18px;color:${iconColor}"></i></div><div style="flex:1"><div style="font-size:14px;font-weight:500;margin-bottom:4px">${a.title}</div><div style="font-size:12px;color:var(--text-tertiary)">Assign: <strong>${a.assignee}</strong> · Tenggat: ${a.due}${portTag}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><span class="pill ${sc}">${a.status}</span><div style="display:flex;gap:6px"><button class="btn-sm" onclick="openAIModal('${a.pid}','${a.id}')">Edit</button>${doneBtn}</div></div></div>`;
  });
  return h;
}

function openMemberModal(idx){
  const isEdit = idx !== null && idx !== undefined;
  const current = isEdit ? teamMembers[idx] : '';
  _showModal(`<div class="modal-title">${isEdit?'Edit anggota':'Tambah anggota tim'}</div>
    <div style="margin-bottom:16px">
      <label style="font-size:12px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">Nama lengkap</label>
      <input id="mem-name" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;box-sizing:border-box;outline:none" placeholder="cth: Reza Wijaya" value="${current}">
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="saveMember(${isEdit?idx:'null'})">Simpan</button>
      <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
    </div>`);
  setTimeout(()=>{ const el=document.getElementById('mem-name'); if(el){el.focus();el.select();} },50);

function saveMember(idx){
  const name = document.getElementById('mem-name').value.trim();
  if(!name) return;
  if(idx===null||idx===undefined||idx==='null'){ teamMembers.push(name); }
  else { teamMembers[idx]=name; }
  closeModal(); render();
}

function deleteMember(idx){
  if(!confirm(`Hapus "${teamMembers[idx]}" dari daftar tim?`)) return;
  teamMembers.splice(idx,1);
  render();
}

function pageBenchmarking(){
  // Periods derived from MONTHLY_ROWS, preserving order (newest first)
  const periods=MONTHLY_ROWS.reduce((acc,r)=>acc.includes(r.bulan)?acc:[...acc,r.bulan],[]);
  const period=ST.benchPeriod||periods[0];
  const kodeMap={nexavar:'NX',solaris:'SA',kirana:'KN',biru:'BS'};
  const rowOf=pid=>MONTHLY_ROWS.find(r=>r.kode===kodeMap[pid]&&r.bulan===period);
  function pct(s){ return s?parseFloat(s):null; }
  function money(s){ if(!s)return null; return parseFloat(s.replace(/\./g,'').replace(',','.').replace(/[^0-9.]/g,'')); }

  const metricDefs={
    ann_yield:{ label:'Ann. yield',    get:pid=>{ const r=rowOf(pid); return r?{disp:r.ann,      num:pct(r.ann)}:null; } },
    yield:    { label:'Monthly yield', get:pid=>{ const r=rowOf(pid); return r?{disp:r.yield,    num:pct(r.yield)}:null; } },
    revenue:  { label:'Revenue',       get:pid=>{ const r=rowOf(pid); return r?{disp:'Rp '+r.rev, num:money(r.rev)}:null; } },
    profit:   { label:'Net profit',    get:pid=>{ const r=rowOf(pid); return r&&r.np?{disp:'Rp '+r.np, num:money(r.np)}:null; } },
    bh:       { label:'Bagi hasil',    get:pid=>{ const r=rowOf(pid); return r?{disp:'Rp '+r.bh, num:money(r.bh)}:null; } },
  };

  const activeKey=ST.benchMetric in metricDefs?ST.benchMetric:'ann_yield';
  const mDef=metricDefs[activeKey];

  const sorted=[...portfolios].sort((a,b)=>{
    const va=mDef.get(a.id), vb=mDef.get(b.id);
    if(!va&&!vb)return 0; if(!va)return 1; if(!vb)return -1;
    return (vb.num||0)-(va.num||0);
  });
  const withData=sorted.filter(p=>mDef.get(p.id));
  const noDataPorts=portfolios.filter(p=>!rowOf(p.id));
  const maxVal=withData.length?(mDef.get(withData[0].id)?.num||1):1;

  let h='';

  // Period + Metric selectors
  h+=`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">`;
  h+=`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:500;color:var(--text-secondary);white-space:nowrap">Periode:</span>`;
  h+=`<select class="filter-select" onchange="setBenchPeriod(this.value)">`;
  periods.forEach(p=>{ h+=`<option value="${p}"${period===p?' selected':''}>${p}</option>`; });
  h+=`</select></div>`;
  h+=`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:500;color:var(--text-secondary);white-space:nowrap">Metrik:</span>`;
  h+=`<div class="tab-row" style="margin:0">`;
  Object.entries(metricDefs).forEach(([k,v])=>{ h+=`<div class="tab${activeKey===k?' active':''}" style="font-size:12px" onclick="setBenchMetric('${k}')">${v.label}</div>`; });
  h+=`</div></div></div>`;

  // Warning: portfolios without data for this period
  if(noDataPorts.length){
    const names=noDataPorts.map(p=>`<strong>${p.name}</strong>`).join(', ');
    h+=`<div style="display:flex;align-items:flex-start;gap:10px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#92400E">
      <i class="ti ti-alert-triangle" style="font-size:16px;flex-shrink:0;margin-top:1px;color:#D97706"></i>
      <span>Data periode <strong>${period}</strong> belum tersedia untuk: ${names}. Portfolio tersebut tidak diikutkan dalam perbandingan.</span>
    </div>`;
  }

  // Ranking bar chart
  h+=`<div class="card" style="margin-bottom:14px"><div class="card-hdr"><span class="card-title">Ranking — ${mDef.label} · ${period}</span></div>`;
  if(!withData.length){
    h+=`<div style="text-align:center;padding:28px;color:var(--text-tertiary);font-size:13px">Tidak ada data untuk periode ini.</div>`;
  } else {
    const medals=['🥇','🥈','🥉'];
    sorted.forEach((p,i)=>{
      const val=mDef.get(p.id);
      const rankIdx=withData.findIndex(x=>x.id===p.id);
      const rankLabel=val?(rankIdx<3?medals[rankIdx]:`#${rankIdx+1}`):'—';
      const barW=val?Math.max(4,Math.round((val.num/maxVal)*100)):0;
      const isLast=i===sorted.length-1;
      h+=`<div class="bench-row" style="${isLast?'':'border-bottom:1px solid var(--border-light)'}" onclick="openP('${p.id}')">
        <span class="rank-num" style="min-width:28px;text-align:center">${rankLabel}</span>
        <div style="flex:1">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
            <span style="font-size:13px;font-weight:500">${p.name}</span>
            <div style="display:flex;align-items:center;gap:8px">
              ${hBadge(p.health)}
              ${val
                ?`<span style="font-size:13px;font-weight:600;color:var(--navy);min-width:64px;text-align:right">${val.disp}</span>`
                :`<span style="font-size:11px;color:var(--text-tertiary);background:var(--bg-secondary);border:1px solid var(--border);border-radius:5px;padding:2px 8px">Belum ada data</span>`
              }
            </div>
          </div>
          ${val
            ?`<div style="height:5px;background:var(--bg-tertiary);border-radius:99px;overflow:hidden"><div style="width:${barW}%;height:100%;background:${p.health==='Siaga 3'?'#EF4444':p.health==='Siaga 2'?'#EA580C':p.health==='Siaga 1'?'#D97706':'#2563EB'};border-radius:99px"></div></div>`
            :`<div style="height:5px;background:repeating-linear-gradient(90deg,#E5E7EB 0,#E5E7EB 5px,transparent 5px,transparent 9px);border-radius:99px"></div>`
          }
        </div>
      </div>`;
    });
  }
  h+=`</div>`;

  // Full comparison table
  h+=`<div class="card"><div class="card-hdr"><span class="card-title">Perbandingan lengkap · ${period}</span></div>`;
  h+=`<table class="tbl"><thead><tr><th>Portfolio</th><th>Health</th><th>Monthly yield</th><th>Ann. yield</th><th>Revenue</th><th>Net profit</th><th>Bagi hasil</th></tr></thead><tbody>`;
  sorted.forEach(p=>{
    const r=rowOf(p.id);
    const na=`<span class="na-cell">N/A</span>`;
    h+=`<tr style="cursor:pointer${!r?';opacity:0.5':''}" onclick="openP('${p.id}')">
      <td style="font-weight:500">${p.name}${!r?` <span style="font-size:10px;font-weight:400;color:var(--text-tertiary)">· belum ada data</span>`:''}`;
    h+=`</td><td>${hBadge(p.health)}</td>`;
    h+=`<td class="${r?'pos':''}">${r?r.yield:na}</td>`;
    h+=`<td class="${r?'pos':''}">${r?r.ann:na}</td>`;
    h+=`<td>${r?'Rp '+r.rev:na}</td>`;
    h+=`<td>${r&&r.np?'Rp '+r.np:na}</td>`;
    h+=`<td>${r?'Rp '+r.bh:na}</td>`;
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

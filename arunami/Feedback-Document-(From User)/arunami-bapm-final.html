function renderMeetingContent(){
  const p=portfolios[ST.meetingPidIdx];
  const pid=p.id;
  const allPeriods=MONTHLY_ROWS.reduce((acc,r)=>acc.includes(r.bulan)?acc:[...acc,r.bulan],[]);
  const period=ST.meetingPeriods[pid]||allPeriods[0];
  const cPeriod=ST.meetingComparePeriods[pid]||'';
  const kodeMap={nexavar:'NX',solaris:'SA',kirana:'KN',biru:'BS'};
  const rowOf=(id,per)=>MONTHLY_ROWS.find(r=>r.kode===kodeMap[id]&&r.bulan===per);
  const row=rowOf(pid,period);
  const cRow=cPeriod?rowOf(pid,cPeriod):null;
  const projRow=PROJ_TARGETS[kodeMap[pid]]||null;

  // Parse helpers
  function parsePct(s){ return s?parseFloat(s):null; }
  function parseMoney(s){ if(!s) return null; return parseFloat(s.replace(/\./g,'').replace(/[^0-9]/g,'')); }
  function delta(v1,v2,isPct){
    if(v1===null||v2===null) return '';
    const d=v1-v2, sign=d>0?'+':'';
    let txt;
    if(isPct) txt=sign+d.toFixed(1)+'pp';
    else { const a=Math.abs(d); txt=(d>=0?'+':'-')+(a>=1000?(a/1000).toFixed(1)+'B':a.toFixed(0)+'M'); }
    const col=d>0?'#6EE7B7':d<0?'#FCA5A5':'rgba(255,255,255,0.4)';
    const arr=d>0?'↑':d<0?'↓':'—';
    return `<div style="font-size:11px;color:${col};margin-top:3px">${arr} ${txt} vs ${cPeriod}</div>`;
  }

  function kpiCard(label, valStr, isPct, isAlert){
    const num=isPct?parsePct(valStr):parseMoney(valStr);
    const cValStr=cRow?(isPct?cRow[isPct]:cRow[isPct]):null; // placeholder
    const col=isAlert?'#FCA5A5':'#fff';
    return `<div class="m-kpi">
      <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:4px">${label}</div>
      <div style="font-size:18px;font-weight:600;color:${col}">${valStr||'N/A'}</div>
      ${cRow?delta(num, isPct?parsePct(cRow[label==='Monthly yield'?'yield':label==='Ann. yield'?'ann':label==='Revenue'?'rev':label==='Net profit'?'np':'bh']):parseMoney(cRow[label==='Monthly yield'?'yield':label==='Ann. yield'?'ann':label==='Revenue'?'rev':label==='Net profit'?'np':'bh']),isPct):''}
    </div>`;
  }

  function projDelta(v1,v2,isPct){
    if(v1===null||v2===null) return '';
    const d=v1-v2; let txt;
    if(isPct) txt=(d>=0?'+':'')+d.toFixed(1)+'pp';
    else { const a=Math.abs(d); txt=(d>=0?'+':'-')+(a>=1000?(a/1000).toFixed(1)+'B':a.toFixed(0)+'M'); }
    const col=d>=0?'#6EE7B7':'#FCA5A5', arr=d>=0?'▲':'▼';
    return `<div style="font-size:11px;color:${col};margin-top:3px">${arr} ${txt} vs proyeksi</div>`;
  }

  // KPIs directly
  function mkKpi(label, field, isPct){
    const val=row?row[field]:null;
    const cVal=cRow?cRow[field]:null;
    const pVal=projRow?projRow[field]:null;
    const numV=isPct?parsePct(val):parseMoney(val);
    const numC=isPct?parsePct(cVal):parseMoney(cVal);
    const numP=isPct?parsePct(pVal):parseMoney(pVal);
    const isAlert=field==='yield'&&(p.health==='Siaga 2'||p.health==='Siaga 3');
    const col=isAlert?'#FCA5A5':field==='yield'||field==='ann'?'#6EE7B7':'#fff';
    return `<div class="m-kpi">
      <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:4px">${label}</div>
      <div style="font-size:18px;font-weight:600;color:${col}">${val||(row?'N/A':'—')}</div>
      ${(cRow&&val&&cVal)?delta(numV,numC,isPct):''}
      ${(ST.meetingVsProj&&val&&pVal)?projDelta(numV,numP,isPct):''}
    </div>`;
  }

  // Health badge
  const hBadgeM=p.health==='Siaga 3'
    ?'<span style="background:rgba(220,38,38,0.2);color:#FCA5A5;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600">⚠ Siaga 3</span>'
    :p.health==='Siaga 2'
    ?'<span style="background:rgba(234,88,12,0.2);color:#FDBA74;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600">Siaga 2</span>'
    :p.health==='Siaga 1'
    ?'<span style="background:rgba(217,119,6,0.2);color:#FCD34D;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600">Siaga 1</span>'
    :'<span style="background:rgba(5,150,105,0.2);color:#6EE7B7;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600">Sehat</span>';

  let h='';

  // Header: logo + name
  h+=`<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
    ${_mBrandLogo(pid,46)}
    <div style="flex:1">
      <div style="font-size:20px;font-weight:700;color:#fff">${p.name}</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:3px">${p.pt} · ${p.industri} · ${p.tahap}</div>
    </div>
    ${hBadgeM}
  </div>`;

  // Period + compare selectors
  const periodOpts=allPeriods.map(per=>`<option value="${per}"${per===period?' selected':''}>${per}</option>`).join('');
  const cOpts='<option value="">Tanpa perbandingan</option>'+allPeriods.filter(per=>per!==period).map(per=>`<option value="${per}"${per===cPeriod?' selected':''}>${per}</option>`).join('');
  h+=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:7px">
      <span style="font-size:11px;color:rgba(255,255,255,0.4)">Periode:</span>
      <select class="m-select" onchange="setMeetingPeriod('${pid}',this.value)">${periodOpts}</select>
    </div>
    <div style="display:flex;align-items:center;gap:7px">
      <span style="font-size:11px;color:rgba(255,255,255,0.4)">Bandingkan vs:</span>
      <select class="m-select" onchange="setMeetingComparePeriod('${pid}',this.value)">${cOpts}</select>
    </div>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:rgba(255,255,255,0.7)">
      <input type="checkbox" ${ST.meetingVsProj?'checked':''} onchange="setMeetingVsProj(this.checked)" style="accent-color:#2563EB"> Bandingkan vs Proyeksi
    </label>
    ${!row?`<span style="font-size:11px;color:#FCA5A5"><i class="ti ti-alert-triangle"></i> Data ${period} belum tersedia</span>`:''}
  </div>`;

  // KPI grid (5 metrics)
  h+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px">
    ${mkKpi('Monthly yield','yield',true)}
    ${mkKpi('Ann. yield','ann',true)}
    ${mkKpi('Revenue','rev',false)}
    ${mkKpi('Net profit','np',false)}
    ${mkKpi('Bagi hasil','bh',false)}
  </div>`;

  // Weekly data update (input manual)
  const weekly=ST.meetingWeekly[pid]||[];
  h+=`<div class="meeting-card"><div class="meeting-card-title"><i class="ti ti-calendar-week" style="margin-right:6px;opacity:0.6"></i>Update Data Mingguan</div>`;
  const projRevM=projRow?(parseMoney(projRow.rev)/4):null; // target mingguan ≈ proyeksi bulanan / 4
  const projNpM=projRow&&projRow.np?(parseMoney(projRow.np)/4):null;
  if(weekly.length){
    h+=`<div style="display:grid;grid-template-columns:auto 1fr 1fr 1.4fr;gap:8px;font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.05em;padding:0 2px 6px;border-bottom:1px solid rgba(255,255,255,0.08)"><span>Minggu</span><span style="text-align:right">Revenue</span><span style="text-align:right">Net profit</span><span>Catatan</span></div>`;
    weekly.forEach(w=>{
      const rv=parseFloat(w.rev)||0, np=parseFloat(w.np)||0;
      const rvD=projRevM!=null?`<span style="font-size:10px;color:${rv>=projRevM?'#6EE7B7':'#FCA5A5'};margin-left:5px">${rv>=projRevM?'▲':'▼'} vs plan</span>`:'';
      h+=`<div style="display:grid;grid-template-columns:auto 1fr 1fr 1.4fr;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:12px;color:rgba(255,255,255,0.85)"><span style="font-weight:600">${w.week}</span><span style="text-align:right">${rv}M${rvD}</span><span style="text-align:right">${np}jt</span><span style="color:rgba(255,255,255,0.5)">${w.note||'—'}</span></div>`;
    });
  } else {
    h+=`<div style="font-size:12px;color:rgba(255,255,255,0.3);padding:4px 0 8px">Belum ada update mingguan untuk portfolio ini.${projRevM!=null?` Target/minggu ≈ ${projRevM.toFixed(2)}M revenue.`:''}</div>`;
  }
  h+=`<div style="display:grid;grid-template-columns:auto 1fr 1fr 1.4fr auto;gap:8px;align-items:center;margin-top:10px">
    <select class="m-select" id="m-wk-week">${['Minggu 1','Minggu 2','Minggu 3','Minggu 4'].map(w=>`<option>${w}</option>`).join('')}</select>
    <input type="number" step="0.01" class="m-note-input" id="m-wk-rev" placeholder="Revenue (M)" style="min-height:auto;resize:none;padding:7px 10px">
    <input type="number" class="m-note-input" id="m-wk-np" placeholder="Net profit (jt)" style="min-height:auto;resize:none;padding:7px 10px">
    <input type="text" class="m-note-input" id="m-wk-note" placeholder="Catatan singkat..." style="min-height:auto;resize:none;padding:7px 10px">
    <button class="m-btn m-btn-primary" style="white-space:nowrap" onclick="addMeetingWeekly('${pid}')">+ Update</button>
  </div></div>`;

  // Notes
  const existingNotes=notes[pid]||[], mNotes=ST.meetingNotes[pid]||[];
  h+=`<div class="meeting-card"><div class="meeting-card-title"><i class="ti ti-notes" style="margin-right:6px;opacity:0.6"></i>Notes & Issues</div>`;
  if(existingNotes.length){ existingNotes.forEach(n=>{
    const sc=n.status==='Open'?'#FCA5A5':n.status==='In Progress'?'#FCD34D':'#6EE7B7';
    h+=`<div class="m-note-item"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px"><div style="font-size:13px;font-weight:500;color:rgba(255,255,255,0.9)">${n.title}</div><span style="font-size:10px;color:${sc};background:rgba(255,255,255,0.08);padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0">${n.status}</span></div><div style="font-size:12px;color:rgba(255,255,255,0.45)">${n.body.slice(0,90)}${n.body.length>90?'…':''}</div></div>`;
  }); }
  if(mNotes.length){ mNotes.forEach(n=>{ h+=`<div class="m-note-item" style="border-color:rgba(37,99,235,0.4)"><div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:3px">✦ Baru ditambahkan</div><div style="font-size:13px;color:rgba(255,255,255,0.9)">${n}</div></div>`; }); }
  if(!existingNotes.length&&!mNotes.length) h+=`<div style="font-size:12px;color:rgba(255,255,255,0.3);padding:4px 0 8px">Belum ada catatan untuk portfolio ini.</div>`;
  h+=`<div style="margin-top:10px"><textarea class="m-note-input" id="m-note-inp" placeholder="Tambah catatan baru..."></textarea><button class="m-btn m-btn-primary" style="margin-top:6px" onclick="addMeetingNote('${pid}')">+ Simpan catatan</button></div></div>`;

  // Action Items
  const existingAI=actionItems[pid]||[], mActions=ST.meetingActions[pid]||[];
  h+=`<div class="meeting-card"><div class="meeting-card-title"><i class="ti ti-checkbox" style="margin-right:6px;opacity:0.6"></i>Action Items</div>`;
  if(existingAI.length){ existingAI.forEach(a=>{
    const isOd=a.status==='Overdue', isDone=a.status==='Selesai';
    h+=`<div class="m-ai-item"><div style="padding-top:2px"><i class="ti ti-${isDone?'circle-check':'circle'}" style="font-size:16px;color:${isOd?'#FCA5A5':isDone?'#6EE7B7':'rgba(255,255,255,0.4)'}"></i></div><div style="flex:1"><div style="font-size:13px;color:rgba(255,255,255,0.9)">${a.title}</div><div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px"><strong style="color:rgba(255,255,255,0.6)">${a.assignee}</strong> · Tenggat: ${a.due} · <span style="color:${isOd?'#FCA5A5':isDone?'#6EE7B7':'rgba(255,255,255,0.4)'}">${a.status}</span></div></div></div>`;
  }); }
  if(mActions.length){ mActions.forEach(a=>{ h+=`<div class="m-ai-item" style="border-color:rgba(37,99,235,0.4)"><div style="padding-top:2px"><i class="ti ti-circle" style="font-size:16px;color:rgba(255,255,255,0.3)"></i></div><div style="flex:1"><div style="font-size:13px;color:rgba(255,255,255,0.9)">${a.title}</div><div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px">✦ Baru · Assign: <strong style="color:rgba(255,255,255,0.6)">${a.assignee}</strong></div></div></div>`; }); }
  if(!existingAI.length&&!mActions.length) h+=`<div style="font-size:12px;color:rgba(255,255,255,0.3);padding:4px 0 8px">Belum ada action items untuk portfolio ini.</div>`;
  h+=`<div style="margin-top:10px;display:flex;gap:8px"><input type="text" class="m-note-input" id="m-ai-inp" placeholder="Tambah action item baru..." style="min-height:auto;resize:none;padding:8px 12px"><button class="m-btn m-btn-primary" style="white-space:nowrap" onclick="addMeetingAction('${pid}')">+ Tambah</button></div></div>`;

  document.getElementById('meeting-content').innerHTML=`<div class="meeting-content-inner">${h}</div>`;
}

function setMeetingPid(idx){ ST.meetingPidIdx=idx; renderMeeting(); }
function setMeetingPeriod(pid,per){ ST.meetingPeriods={...ST.meetingPeriods,[pid]:per}; renderMeetingContent(); }
function setMeetingComparePeriod(pid,per){ ST.meetingComparePeriods={...ST.meetingComparePeriods,[pid]:per}; renderMeetingContent(); }
function addMeetingNote(pid){ const el=document.getElementById('m-note-inp'); if(!el||!el.value.trim()) return; ST.meetingNotes[pid]=[...(ST.meetingNotes[pid]||[]),el.value.trim()]; renderMeetingContent(); }
function addMeetingAction(pid){ const el=document.getElementById('m-ai-inp'); if(!el||!el.value.trim()) return; ST.meetingActions[pid]=[...(ST.meetingActions[pid]||[]),{title:el.value.trim(),assignee:teamMembers[0]||'—',due:''}]; renderMeetingContent(); }
function addMeetingWeekly(pid){
  const week=document.getElementById('m-wk-week').value;
  const rev=document.getElementById('m-wk-rev').value;
  const np=document.getElementById('m-wk-np').value;
  const note=document.getElementById('m-wk-note').value.trim();
  if(!rev&&!np&&!note) return;
  ST.meetingWeekly[pid]=[...(ST.meetingWeekly[pid]||[]),{week,rev,np,note}];
  renderMeetingContent();
}

    h+=`</tbody></table></div>`;
    h+=`<div style="padding:12px 16px;text-align:right;font-size:11.5px;color:var(--text-tertiary)">Diproses Admin: ${b.diprosesby}</div>`;
    h+=`</div>`;
  });

  if(distAdminBatches.length===0){
    h+=`<div style="text-align:center;padding:48px;color:var(--text-tertiary)"><i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:10px"></i>Belum ada bagi hasil dari Admin</div>`;
  }
  return h;
}

function teruskaInvestor(bid, name){
  const b=distAdminBatches.find(x=>x.id===bid);
  b.forwardedTo[name]=true;
  const allDone=Object.values(b.forwardedTo).every(Boolean);
  if(allDone) b.status='Selesai diteruskan';
  renderContent(); renderSidebar();
  const file=b.buktiPerInvestor[name];
  const port=portfolios.find(x=>x.id===b.pid);
  const notifMsg=`Laporan & bukti transfer ${port?port.name:b.pid} ${b.period} diteruskan ke ${name}${file?' ('+file+')':''}`;
  // toast via function
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;background:#059669;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15)';
  t.innerHTML=`<i class="ti ti-circle-check"></i>${notifMsg}`;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300);},2800);
}

function teruskaSemua(bid){
  const b=distAdminBatches.find(x=>x.id===bid);
  Object.keys(b.forwardedTo).forEach(n=>{ b.forwardedTo[n]=true; });
  b.status='Selesai diteruskan';
  renderContent(); renderSidebar();
  const port=portfolios.find(x=>x.id===b.pid);
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;background:#059669;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15)';
  t.innerHTML=`<i class="ti ti-circle-check"></i>Semua investor ${port?port.name:b.pid} ${b.period} telah menerima laporan &amp; bukti transfer`;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300);},2800);
}

        </div>
      </div>
    </div>
  </div>`;
  _showModal(html, true);
}

function insertToLapEditor(text){
  const ta=document.getElementById('lap-editor-textarea');
  if(!ta) return;
  const pos=ta.selectionEnd;
  const before=ta.value.substring(0,pos);
  const after=ta.value.substring(pos);
  const sep=before.length>0&&!before.endsWith('\n')?'\n':'';
  ta.value=before+sep+text+'\n'+after;
  ta.selectionStart=ta.selectionEnd=pos+sep.length+text.length+1;
  ta.focus();
}

function saveLapDraft(invId, period){
  const ta=document.getElementById('lap-editor-textarea');
  if(!ta) return;
  lapDrafts[`${ST.pid}__${invId}__${period}`]=ta.value;
  ST.lapReEdited[`${ST.pid}__${period}__${invId}`]=true;
  closeModal();
  renderContent();
}
